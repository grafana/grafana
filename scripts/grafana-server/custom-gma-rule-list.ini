; Appended to custom.ini for the second E2E server that runs the new Alert/Recording rule list specs.
; Both flags are read by the backend at startup, so a per-test browser override cannot enable them.
; Everything else comes from the shared custom.ini, which stays unchanged for every other suite.
;
; Local run (the default server on :3001 keeps running untouched):
;   pnpm e2e:playwright:gma-list
; starts this server on :3011 itself. To start it by hand and reuse it:
;   PORT=3011 RUNDIR=scripts/grafana-server/tmp-gma \
;     EXTRA_CUSTOM_INI=scripts/grafana-server/custom-gma-rule-list.ini ./e2e-playwright/start-server
;   GRAFANA_URL=http://localhost:3011 pnpm e2e:playwright:gma-list

[feature_toggles]
alerting.gmaOnlyListView = true
alerting.folderHasRulesLabel = true
