name: Build frontend

description: Builds the Grafana frontend into dist/frontend, or restores it from the cache. Requires Node.js to be set up.

inputs:
  sourcemaps:
    description: Emit source maps. Turn off for test builds that never ship.
    required: false
    default: 'true'
  cache:
    description: Restore and save dist/frontend keyed on the frontend sources. Turn off for release builds.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Restore frontend build
      if: inputs.cache == 'true'
      id: cache
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4 zizmor: ignore[cache-poisoning]
      with:
        key: >-
          frontend-build-v2-${{ runner.os }}-
          sourcemaps-${{ inputs.sourcemaps }}-
          ${{ hashFiles(
            'pnpm-lock.yaml',
            'pnpm-workspace.yaml',
            '.npmrc',
            'patches/**',
            'package.json',
            'project.json',
            'nx.json',
            'tsconfig.json',
            '.browserslistrc',
            '.nvmrc',
            'Makefile',
            'scripts/build-frontend.sh',
            'scripts/rspack/**',
            'scripts/cli/env-util.ts',
            'scripts/cli/package.json',
            'scripts/tsconfig.base.json',
            'packages/**',
            'public/**',
            '!**/*.test.ts',
            '!**/*.test.tsx',
            '.github/actions/build-frontend/**',
            '.github/actions/setup-node/**',
            '.github/actions/yarn-install/**'
          ) }}
        path: dist/frontend

    - name: Install frontend dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      uses: ./.github/actions/yarn-install

    - name: Build frontend
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        NO_SOURCEMAP: ${{ inputs.sourcemaps == 'false' && '1' || '' }}
      run: make build-js

    - name: Save frontend build
      if: inputs.cache == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4 zizmor: ignore[cache-poisoning]
      with:
        key: ${{ steps.cache.outputs.cache-primary-key }}
        path: dist/frontend
