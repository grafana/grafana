name: Check jobs results
description: Checks if any jobs were unsuccessful and exits with error if failures or cancellations are found. Use to check the results of matrix test runs.
inputs:
  needs:
    description: JSON string containing the needs context from the workflow
    required: true
  failure-message:
    description: Custom message to display when failures are found
    required: false
    default: "One or more jobs have failed"
  success-message:
    description: Custom message to display when all jobs pass
    required: false
    default: "All jobs passed successfully"
outputs:
  any-failed:
    description: Whether any jobs failed or were cancelled
    value: ${{ steps.check-jobs.outputs.any-failed }}

runs:
  using: "composite"
  steps:
    - name: Check test suites
      id: check-jobs
      shell: bash
      env:
        NEEDS: ${{ inputs.needs }}
        FAILURE_MSG: ${{ inputs.failure-message }}
        SUCCESS_MSG: ${{ inputs.success-message }}
      run: |
        set -euo pipefail

        # Print the needs context, debugging
        echo "$NEEDS" | jq

        # Skipped jobs are expected when conditional test suites do not apply.
        UNSUCCESSFUL="$(echo "$NEEDS" | jq 'with_entries(select(.value.result != "success" and .value.result != "skipped")) | map_values(.result)')"

        if [ "$(echo "$UNSUCCESSFUL" | jq '. | length')" != "0" ]; then
          echo "❌ $FAILURE_MSG"
          echo "Unsuccessful suites:"
          echo "$UNSUCCESSFUL" | jq -r 'to_entries[] | "- \(.key): \(.value)"'
          echo "any-failed=true" >> "$GITHUB_OUTPUT"
          exit 1
        fi

        echo "✅ $SUCCESS_MSG"
