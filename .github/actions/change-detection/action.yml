name: Detect changed files
description: Detects whether any matching files have changed
inputs:
  self:
    description: The path to the calling workflow (e.g. .github/workflows/backend-unit-tests.yml). It is regarded as any category.
    required: true
  detect-push:
    description: Detect changed files on push events
    default: 'false'
outputs:
  self:
    description: Whether the calling workflow has changed in any way
    value: ${{ steps.changed-files.outputs.self_any_modified || 'true' }}
  backend:
    description: Whether the backend or CI configuration have changed in any way
    value: ${{ steps.changed-files.outputs.backend_any_modified == 'true' ||
      steps.changed-files.outputs.ci_any_modified == 'true' ||
      steps.changed-files.outcome == 'skipped' }}
  backend-src:
    description: Whether the backend or self have changed, excluding test-only changes
    value: ${{ steps.changed-files.outputs.backend_src_any_modified || 'true' }}
  frontend:
    description: Whether the frontend or CI configuration have changed in any way
    value: ${{ steps.changed-files.outputs.frontend_any_modified == 'true' ||
      steps.changed-files.outputs.ci_any_modified == 'true' ||
      steps.changed-files.outcome == 'skipped' }}
  frontend-src:
    description: Whether the frontend or self has changed, excluding test-only changes
    value: ${{ steps.changed-files.outputs.frontend_src_any_modified || 'true' }}
  frontend-dependencies:
    description: Whether the frontend dependencies or self have changed in any way
    value: ${{ steps.changed-files.outputs.frontend_dependencies_any_modified || 'true' }}
  frontend-packages:
    description: Whether any frontend packages have changed
    value: ${{ steps.changed-files.outputs.frontend_packages_any_modified || 'true' }}
  e2e:
    description: Whether the e2e tests, covered code, or CI configuration have changed
    value: ${{ steps.changed-files.outputs.e2e_any_modified == 'true' ||
      steps.changed-files.outputs.backend_any_modified == 'true' ||
      steps.changed-files.outputs.frontend_any_modified == 'true' ||
      steps.changed-files.outputs.ci_any_modified == 'true' }}
  e2e-cloud-plugins:
    description: Whether the cloud plugins code or tests have changed in any way
    value: ${{ steps.changed-files.outputs.e2e_cloud_plugins_any_modified || 'true' }}
  dev-tooling:
    description: Whether the dev tooling or self have changed in any way
    value: ${{ steps.changed-files.outputs.dev_tooling_any_modified || 'true' }}
  docs:
    description: Whether the docs or CI configuration have changed in any way
    value: ${{ steps.changed-files.outputs.docs_any_modified == 'true' ||
      steps.changed-files.outputs.ci_any_modified == 'true' ||
      steps.changed-files.outcome == 'skipped' }}
  dockerfile:
    description: Whether the dockerfile or self have changed in any way
    value: ${{ steps.changed-files.outputs.dockerfile_any_modified || 'true' }}
  docker-build:
    description: Whether files affecting the Docker image build have changed, excluding test-only changes
    value: ${{ steps.changed-files.outputs.docker_build_any_modified || 'true' }}
  makefile:
    description: Whether any Makefile changed
    value: ${{ steps.changed-files.outputs.makefile_any_modified || 'true' }}
  rpm-packaging:
    description: Whether RPM/DEB packaging scripts or the Makefile changed
    value: ${{ steps.changed-files.outputs.rpm_packaging_any_modified || 'true' }}
  devenv:
    description: Whether the devenv or CI configuration have changed in any way
    value: ${{ steps.changed-files.outputs.devenv_any_modified == 'true' ||
      steps.changed-files.outputs.ci_any_modified == 'true' ||
      steps.changed-files.outcome == 'skipped' }}
  integration:
    description: Whether files covered by integration tests changed
    value: ${{ steps.changed-files.outputs.integration_any_modified == 'true' || steps.changed-files.outputs.ci_any_modified == 'true' }}
  pgvector:
    description: Whether files covered by pgvector integration tests changed
    value: ${{ steps.changed-files.outputs.pgvector_any_modified == 'true' || steps.changed-files.outputs.ci_any_modified == 'true' }}
  k8s-codegen:
    description: Whether files covered by Kubernetes code generation changed
    value: ${{ steps.changed-files.outputs.k8s_codegen_any_modified == 'true' || steps.changed-files.outputs.ci_any_modified == 'true' }}
  build-go:
    description: Whether files covered by cross-platform Go builds changed
    value: ${{ steps.changed-files.outputs.build_go_any_modified == 'true' || steps.changed-files.outputs.ci_any_modified == 'true' }}
  go-lint-push:
    description: Whether files covered by Go lint push triggers changed
    value: ${{ steps.changed-files.outputs.go_lint_push_any_modified == 'true' || steps.changed-files.outputs.ci_any_modified == 'true' }}
  govulncheck:
    description: Whether files covered by govulncheck changed
    value: ${{ steps.changed-files.outputs.govulncheck_any_modified == 'true' || steps.changed-files.outputs.ci_any_modified == 'true' }}
  backend-code-push:
    description: Whether files covered by backend code check push triggers changed
    value: ${{ steps.changed-files.outputs.backend_code_push_any_modified == 'true' || steps.changed-files.outputs.ci_any_modified == 'true' }}
runs:
  using: composite
  steps:
    # Assumption: We've done a checkout with the actions/checkout action.
    # It must persist credentials to allow the changed-files action to get more history.
    - name: Detect changes
      id: changed-files
      if: github.event_name == 'pull_request' || inputs.detect-push == 'true'
      uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323 # v47.0.5
      with:
        files_yaml: |
          self:
            - '.github/actions/change-detection/**'
            - '${{ inputs.self }}'
          ci:
            - '.github/actions/report-go-cache-sizes/**'
            - '.github/actions/setup-go-remote-cache/**'
            - '.github/workflows/backend-code-checks.yml'
            - '.github/workflows/backend-unit-tests.yml'
            - '.github/workflows/bootstrap-go-cache.yml'
            - '.github/workflows/build-go-matrix.yml'
            - '.github/workflows/ci.yml'
            - '.github/workflows/feature-toggles-ci.yml'
            - '.github/workflows/go-lint.yml'
            - '.github/workflows/govulncheck.yml'
            - '.github/workflows/pr-e2e-tests.yml'
            - '.github/workflows/pr-frontend-unit-tests.yml'
            - '.github/workflows/pr-go-workspace-check.yml'
            - '.github/workflows/pr-k8s-codegen-check.yml'
            - '.github/workflows/pr-test-integration-pgvector.yml'
            - '.github/workflows/pr-test-integration.yml'
            - '.github/workflows/run-schema-v2-e2e.yml'
            - '.github/workflows/swagger-gen.yml'
          integration:
            - 'Makefile'
            - '**/go.mod'
            - '**/go.sum'
            - '**/go.work'
            - '**/go.work.sum'
            - '**.go'
            - 'pkg/**'
            - 'apps/**'
            - 'scripts/ci/backend-tests/**'
            - 'devenv/**'
            - '.github/actions/setup-go/**'
            - '.github/actions/setup-enterprise/**'
            - '.github/workflows/pr-test-integration.yml'
          pgvector:
            - 'Makefile'
            - '**/go.mod'
            - '**/go.sum'
            - '**/go.work'
            - '**/go.work.sum'
            - 'pkg/storage/unified/search/vector/**'
            - 'pkg/storage/unified/search/embed/**'
            - 'devenv/docker/blocks/pgvector/**'
            - 'devenv/.env'
            - '.github/actions/setup-go/**'
            - '.github/workflows/pr-test-integration-pgvector.yml'
          k8s_codegen:
            - 'pkg/apis/**'
            - 'pkg/apimachinery/apis/**'
            - 'hack/**'
            - 'apps/**'
            - '*.sum'
            - '.github/workflows/pr-k8s-codegen-check.yml'
          build_go:
            - '**/go.mod'
            - '**/go.sum'
            - '**/go.work'
            - '**/go.work.sum'
            - '**.go'
            - 'pkg/**'
            - 'apps/**'
            - 'Makefile'
            - 'packaging/**'
            - 'scripts/build-rpm.sh'
            - 'scripts/build-deb.sh'
            - 'scripts/build-targz.sh'
            - 'scripts/verify-pkg-stig.sh'
            - '.github/actions/setup-go/**'
            - '.github/actions/setup-fpm/**'
            - '.github/actions/setup-enterprise/**'
            - '.github/workflows/build-go-matrix.yml'
          go_lint_push:
            - 'pkg/**'
            - '.github/workflows/go-lint.yml'
            - 'go.*'
          govulncheck:
            - '**/*.go'
            - '.github/workflows/govulncheck.yml'
            - '.citools/src/govulncheck/**'
            - 'go.*'
          backend_code_push:
            - '**'
            - '!*.md'
            - '!docs/**'
            - '!latest.json'
          dockerfile:
            - 'Dockerfile'
            - 'Makefile'
          makefile:
            - 'Makefile'
            - '**/Makefile'
          docker_build:
            # Mirrors the on.paths trigger of pr-test-docker.yml: files that can
            # affect the built Docker image. Test-only changes are excluded below
            # because they never end up in the image.
            - 'Makefile'
            - 'Dockerfile'
            - 'public/**'
            - 'packages/**'
            - 'apps/**'
            - '**/go.mod'
            - '**/go.sum'
            - '**/go.work'
            - '**/go.work.sum'
            - '**/package.json'
            - '**/nx.json'
            - '**/project.json'
            - '**/yarn.lock'
            - 'conf/**'
            - '.yarnrc.yml'
            - '.yarn/**'
            - 'tsconfig.json'
            - '**.js'
            - '*.ts'
            - '**.config.ts'
            - 'scripts/**'
            - 'emails/**'
            - '.citools/**'
            - 'kinds/**'
            - 'embed.go'
            - 'packaging/docker/**'
            - '.github/actions/change-detection/**'
            - '.github/workflows/build-docker-variants.yml'
            - '${{ inputs.self }}'
            - '!**_test.go'
            - '!**.test.ts'
            - '!**.test.tsx'
            - '!**.test.js'
            - '!**.spec.ts'
            - '!**.spec.tsx'
            - '!e2e/**'
            - '!e2e-playwright/**'
            # test-plugins/* are yarn workspaces copied into the image before
            # `yarn install --immutable`, so a manifest change there can break the
            # build even though the rest of e2e-playwright is test-only.
            - 'e2e-playwright/test-plugins/**/package.json'
          rpm_packaging:
            - 'scripts/build-rpm.sh'
            - 'scripts/build-deb.sh'
            - 'scripts/build-targz.sh'
            - 'scripts/verify-pkg-stig.sh'
            - 'Makefile'
            - '${{ inputs.self }}'
          backend:
            - '!*.md'
            - '!docs/**'
            - '!.github/**'
            - '.github/actions/setup-enterprise/**'
            - '.github/actions/setup-go/**'
            - '.github/actions/setup-go-remote-cache/**'
            - '.github/actions/report-go-cache-sizes/**'
            - '.github/actions/checkout/**'
            - '**/go.mod'
            - '**/go.sum'
            - 'go.mod'
            - 'go.sum'
            - 'go.work'
            - 'go.work.sum'
            - '**.go'
            - 'pkg/**'
            - '!pkg/**.md'
            - 'apps/**'
            - '!apps/**.md'
            - 'build.sh'
            - '.github/actions/change-detection/**'
            - '**.cue'
            - 'devenv/docker/blocks/*_tests/**'
            - 'scripts/ci/backend-tests/**'
            - '.github/workflows/bootstrap-go-cache.yml'
            - 'public/app/plugins/**/plugin.json'
            - '${{ inputs.self }}'
          backend_src:
            # Same as `backend` above, but excludes Go test files. Used to gate
            # jobs (e.g. the PR Docker build) that a test-only PR can't affect.
            - '!*.md'
            - '!docs/**'
            - '!.github/**'
            - '.github/actions/setup-enterprise/**'
            - '.github/actions/setup-go/**'
            - '.github/actions/setup-go-remote-cache/**'
            - '.github/actions/report-go-cache-sizes/**'
            - '.github/actions/checkout/**'
            - '**/go.mod'
            - '**/go.sum'
            - 'go.mod'
            - 'go.sum'
            - 'go.work'
            - 'go.work.sum'
            - '**.go'
            - 'pkg/**'
            - '!pkg/**.md'
            - 'apps/**'
            - '!apps/**.md'
            - 'build.sh'
            - '.github/actions/change-detection/**'
            - '**.cue'
            - 'devenv/docker/blocks/*_tests/**'
            - 'scripts/ci/backend-tests/**'
            - '.github/workflows/bootstrap-go-cache.yml'
            - '${{ inputs.self }}'
            - '!**_test.go'
          frontend:
            - '.github/actions/setup-enterprise/**'
            - '.github/actions/checkout/**'
            - 'public/**'
            - '**.js'
            - '**.jsx'
            - '**.ts'
            - '**.tsx'
            - '**.css'
            - '**.mjs'
            - 'yarn.lock'
            - 'package.json'
            - '!**.md'
            - '.github/actions/change-detection/**'
            - '**.cue'
            - '.prettier*'
            - '.yarnrc.yml'
            - 'yarn.config.cjs'
            - 'eslint.config.js'
            - 'jest.config.js'
            - 'nx.json'
            - 'tsconfig.json'
            - '.yarn/**'
            - 'apps/dashboard/pkg/migration/**'
            - '${{ inputs.self }}'
          frontend_src:
            # Same as `frontend` above, but excludes test-only changes. Used to
            # gate frontend jobs (e.g. Meticulous) that a test-only PR can't affect.
            - '.github/actions/setup-enterprise/**'
            - '.github/actions/checkout/**'
            - 'public/**'
            - '**.js'
            - '**.jsx'
            - '**.ts'
            - '**.tsx'
            - '**.css'
            - '**.mjs'
            - 'yarn.lock'
            - 'package.json'
            - '!**.md'
            - '.github/actions/change-detection/**'
            - '**.cue'
            - '.prettier*'
            - '.yarnrc.yml'
            - 'yarn.config.cjs'
            - 'eslint.config.js'
            - 'jest.config.js'
            - 'nx.json'
            - 'tsconfig.json'
            - '.yarn/**'
            - 'apps/dashboard/pkg/migration/**'
            - '${{ inputs.self }}'
            - '!**.test.ts'
            - '!**.test.tsx'
            - '!**.test.js'
            - '!**.spec.ts'
            - '!**.spec.tsx'
            - '!**.spec.js'
            - '!e2e/**'
            - '!e2e-playwright/**'
            # apps/dashboard/pkg/migration/** carries Go tests; exclude them too.
            - '!**_test.go'
          frontend_dependencies:
            - 'yarn.lock'
            - 'package.json'
            - '**/package.json'
            - '.yarnrc.yml'
            - 'yarn.config.cjs'
          frontend_packages:
            - '.github/actions/checkout/**'
            - '.github/actions/change-detection/**'
            - 'packages/**'
            - './scripts/validate-npm-packages.sh'
            - '${{ inputs.self }}'
          e2e:
            - 'e2e/**'
            - 'e2e-playwright/**'
            - '.github/actions/setup-enterprise/**'
            - '.github/actions/checkout/**'
            - 'emails/**'
            - 'pkg/**'
            - 'proto/**'
            - '**/Makefile'
            - 'scripts/**'
            - '!**.md'
            - '.github/actions/change-detection/**'
            - '**.cue'
            - 'conf/**'
            - 'cypress.config.js'
            - '${{ inputs.self }}'
          e2e_cloud_plugins:
            - 'pkg/tsdb/azuremonitor/**'
            - 'public/app/plugins/datasource/azuremonitor/**'
            - 'e2e-playwright/cloud-plugins-suite/azure-monitor.spec.ts'
            - '${{ inputs.self }}'
          dev_tooling:
            - '.github/actions/setup-enterprise/**'
            - '.github/actions/checkout/**'
            - '**.sh'
            - '.prettierrc.js'
            - '**/Makefile'
            - 'proto/**.yaml'
            - 'pkg/build/**'
            - 'pkg/wire/**'
            - 'scripts/**'
            - '!**.md'
            - '.citools/**'
            - '.github/actions/change-detection/**'
            - '${{ inputs.self }}'
          docs:
            - 'contribute/**'
            - 'docs/**'
            - '**.md'
            - 'LICENSE'
            - '.vale.ini'
            - '.github/actions/change-detection/**'
            - '${{ inputs.self }}'
          devenv:
            - 'devenv/**'
            - '.dockerignore'
            - '${{ inputs.self }}'
    - name: Print all change groups
      shell: bash
      run: |
        echo "Self: ${{ steps.changed-files.outputs.self_any_modified || 'true' }}"
        echo " --> ${{ steps.changed-files.outputs.self_all_modified_files }}"
        echo "Backend: ${{ steps.changed-files.outputs.backend_any_modified || 'true' }}"
        echo " --> ${{ steps.changed-files.outputs.backend_all_modified_files }}"
        echo "Backend (src): ${{ steps.changed-files.outputs.backend_src_any_modified || 'true' }}"
        echo " --> ${{ steps.changed-files.outputs.backend_src_all_modified_files }}"
        echo "Frontend: ${{ steps.changed-files.outputs.frontend_any_modified || 'true' }}"
        echo " --> ${{ steps.changed-files.outputs.frontend_all_modified_files }}"
        echo "Frontend (src): ${{ steps.changed-files.outputs.frontend_src_any_modified || 'true' }}"
        echo " --> ${{ steps.changed-files.outputs.frontend_src_all_modified_files }}"
        echo "Frontend packages: ${{ steps.changed-files.outputs.frontend_packages_any_modified || 'true' }}"
        echo " --> ${{ steps.changed-files.outputs.frontend_packages_all_modified_files }}"
        echo "E2E: ${{ steps.changed-files.outputs.e2e_any_modified || 'true' }}"
        echo " --> ${{ steps.changed-files.outputs.e2e_all_modified_files }}"
        echo " --> ${{ steps.changed-files.outputs.backend_all_modified_files }}"
        echo " --> ${{ steps.changed-files.outputs.frontend_all_modified_files }}"
        echo "E2E cloud plugins: ${{ steps.changed-files.outputs.e2e_cloud_plugins_any_modified || 'true' }}"
        echo " --> ${{ steps.changed-files.outputs.e2e_cloud_plugins_all_modified_files }}"
        echo "Dev Tooling: ${{ steps.changed-files.outputs.dev_tooling_any_modified || 'true' }}"
        echo " --> ${{ steps.changed-files.outputs.dev_tooling_all_modified_files }}"
        echo "Docs: ${{ steps.changed-files.outputs.docs_any_modified || 'true' }}"
        echo " --> ${{ steps.changed-files.outputs.docs_all_modified_files }}"
        echo "Dockerfile: ${{ steps.changed-files.outputs.dockerfile_any_modified || 'true' }}"
        echo " --> ${{ steps.changed-files.outputs.dockerfile_all_modified_files }}"
        echo "Docker build: ${{ steps.changed-files.outputs.docker_build_any_modified || 'true' }}"
        echo " --> ${{ steps.changed-files.outputs.docker_build_all_modified_files }}"
        echo "Makefile: ${{ steps.changed-files.outputs.makefile_any_modified || 'true' }}"
        echo " --> ${{ steps.changed-files.outputs.makefile_all_modified_files }}"
        echo "RPM packaging: ${{ steps.changed-files.outputs.rpm_packaging_any_modified || 'true' }}"
        echo " --> ${{ steps.changed-files.outputs.rpm_packaging_all_modified_files }}"
        echo "devenv: ${{ steps.changed-files.outputs.devenv_any_modified || 'true' }}"
        echo " --> ${{ steps.changed-files.outputs.devenv_all_modified_files }}"
