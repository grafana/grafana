name: Run a compatibility test phase
description: Runs one phase of pkg/tests/compat from prebuilt test binaries. See pkg/tests/compat/README.md.

inputs:
  checkout:
    description: Grafana checkout the tests run in; they read testdata and config from it
    required: true
  newer-binaries:
    description: Directory with the <package>.test binaries built by go test -c from the newer version
    required: true
  older-binaries:
    description: Directory with the <package>.test binaries built by go test -c from the older version
    required: true
  test:
    description: TestCompatSetup, TestCompatUpdate, or TestCompatVerify
    required: true
  role:
    description: older or newer, the version that runs this phase; checkout must be that version's
    required: true
  data:
    description: Directory shared by the phases of one round trip
    required: true
  log:
    description: File the output is appended to
    required: true

runs:
  using: composite
  steps:
    - name: Run ${{ inputs.test }}
      shell: bash
      env:
        CHECKOUT: ${{ inputs.checkout }}
        NEWER_CHECKOUT: ${{ github.workspace }}
        NEWER_BINARIES: ${{ inputs.newer-binaries }}
        OLDER_BINARIES: ${{ inputs.older-binaries }}
        TEST: ${{ inputs.test }}
        GRAFANA_COMPAT_ROLE: ${{ inputs.role }}
        GRAFANA_COMPAT_DIR: ${{ inputs.data }}
        LOG: ${{ inputs.log }}
      run: |
        set -uo pipefail
        # Resolved once here, so go never runs in the older checkout, whose go.mod may ask
        # for another toolchain.
        test2json="$(go tool -n test2json)" || exit 1
        rc=0
        ran=0
        # go test -c names each binary after its package directory under pkg/tests/compat.
        for newer in "$NEWER_BINARIES"/*.test; do
          [ -e "$newer" ] || continue
          pkg="$(basename "$newer" .test)"
          # The harness package itself only has unit tests and no directory of its own to run in.
          if [ "$pkg" = compat ]; then continue; fi
          bin="$newer"
          dir="$CHECKOUT"
          role="$GRAFANA_COMPAT_ROLE"
          if [ -e "$OLDER_BINARIES/$pkg.test" ]; then
            ran=$((ran + 1))
            if [ "$GRAFANA_COMPAT_ROLE" = older ]; then bin="$OLDER_BINARIES/$pkg.test"; fi
          else
            # Every phase of a package must run the same version, or update and verify find no
            # fixtures or changes that never happened. Until a release ships the package, it
            # runs against the newer version alone, on its own database, so it still runs in CI.
            echo "::notice::Running $pkg in $TEST with the newer version only: the older version does not ship it"
            dir="$NEWER_CHECKOUT"
            role=newer
          fi
          echo "=== $pkg"
          events="${LOG%.log}-$pkg.json"
          failed=0
          (cd "$dir/pkg/tests/compat/$pkg" && GRAFANA_COMPAT_ROLE="$role" "$test2json" -t -p "$pkg" "$bin" -test.count=1 -test.timeout=20m -test.v=test2json -test.run "^${TEST}\$") \
            | tee "$events" | jq --unbuffered -rj 'select(.Action == "output") | .Output' | tee -a "$LOG" || failed=1
          # A binary without the test, or a test that skips, exits 0 without checking anything.
          if ! jq -e --arg test "$TEST" 'select(.Test == $test and .Action == "pass")' "$events" > /dev/null; then
            echo "::error::$pkg did not pass $TEST: it is missing, skipped, or failed"
            failed=1
          fi
          # The watchdog of a phase writes its owners to a file shortly before the test timeout, and a
          # phase that ends in time removes it. One left behind may also come from a crash, so the
          # summary only gets it when Go reported the timeout.
          entry="$GRAFANA_COMPAT_DIR/timeout-$pkg-$TEST.md"
          reported=0
          reason="failed without a report"
          marker="[compat-owner]"
          # TestMain emits this after database cleanup, even when m.Run reports a test failure.
          # An earlier assertion report cannot account for a process that died before this point.
          if ! jq -e 'select(.Action == "output" and .Output == "[compat-phase-complete]\n")' "$events" > /dev/null; then
            echo "::error::$pkg did not complete $TEST"
            failed=1
            reason="terminated before completing"
            marker="[compat-panic-owner]"
            if jq -e 'select(.Action == "output" and (.Output | startswith("panic: test timed out after ")))' "$events" > /dev/null; then
              reason="timed out"
              if [ -f "$entry" ]; then
                cat "$entry" >> "$GITHUB_STEP_SUMMARY"
                reported=1
              fi
            fi
          fi
          rm -f "$entry"
          if [ "$failed" -eq 1 ]; then rc=1; fi
          # The newer binary resolves package owners in a separate process, using the CODEOWNERS
          # in review. This also covers crashes before the test can run its cleanup callbacks.
          if [ "$failed" -eq 1 ] && [ "$reported" -eq 0 ] \
            && ! jq -e --arg marker "$marker" 'select(.Action == "output" and (.Output | contains($marker + " owned by ")))' "$events" > /dev/null; then
            owners="$(cd "$NEWER_CHECKOUT/pkg/tests/compat/$pkg" && GRAFANA_COMPAT_PRINT_OWNERS=1 "$newer" 2> /dev/null)" || owners=""
            if [ -n "$owners" ]; then
              echo "- \`$pkg/$TEST\` ($role, $(basename "$GRAFANA_COMPAT_DIR")) $reason, owned by $owners" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
        done
        # A missing build or no package in common must not pass as a green phase, even when
        # packages only the newer version ships ran.
        if [ "$ran" -eq 0 ]; then
          echo "::error::No package both versions ship ran in $TEST: the newer and older test binaries have none in common"
          exit 1
        fi
        exit "$rc"
