name: Setup Go
description: Sets up Go and restores shared module and build caches.

inputs:
  go-version-file:
    description: Path to go.mod or go.work for Go version detection.
    required: false
    default: go.mod
  cache:
    description: Whether to restore Go module and build caches.
    required: false
    default: 'true'
  cache-write:
    description: Whether this job may save the cache.
    required: false
    default: 'false'

outputs:
  cache-hit:
    description: Whether cache for current commit was restored.
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Compute Go cache key
      id: keys
      if: inputs.cache == 'true'
      uses: ./.github/actions/go-cache-keys
      with:
        go-version-file: ${{ inputs.go-version-file }}

    - name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: false

    - name: Restore Go cache
      id: cache-restore
      if: inputs.cache == 'true' && inputs.cache-write != 'true'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ steps.keys.outputs.key }}
        restore-keys: ${{ steps.keys.outputs.restore-key }}

    - name: Restore and save Go cache
      id: cache-save
      if: inputs.cache == 'true' && inputs.cache-write == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ steps.keys.outputs.key }}
        restore-keys: ${{ steps.keys.outputs.restore-key }}

    - id: cache
      if: inputs.cache == 'true'
      shell: bash
      env:
        RESTORE_HIT: ${{ steps.cache-restore.outputs.cache-hit }}
        SAVE_HIT: ${{ steps.cache-save.outputs.cache-hit }}
      run: echo "cache-hit=${RESTORE_HIT:-$SAVE_HIT}" >> "$GITHUB_OUTPUT"

    - name: Report Go cache sizes
      if: inputs.cache == 'true'
      uses: ./.github/actions/report-go-cache-sizes
