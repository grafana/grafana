name: Setup Go
description: Sets up a Go environment with cache-friendly defaults for the Grafana repository.

inputs:
  go-version-file:
    description: Path to go.mod or go.work file for version detection.
    required: false
    default: 'go.mod'
  cache:
    description: Whether to restore the module and build caches.
    required: false
    default: 'true'
  build-cache:
    description: >-
      Whether this job wants the build cache as well as the module cache.
    required: false
    default: 'true'
  cache-write:
    description: >-
      Which cache this job may save: 'none', 'mod' or 'build'. Only the
      bootstrap workflows write, and each writes one of them, so no key has
      more than one writer. A GitHub cache entry cannot be rewritten, so a job
      that compiles little must not be able to claim a shared key.
    required: false
    default: 'none'

runs:
  using: "composite"
  steps:
    # The toolchain has to be restored before setup-go runs, or setup-go
    # downloads the pinned version instead of finding it in the tool cache.
    - name: Compute Go cache keys
      id: keys
      if: inputs.cache == 'true'
      uses: ./.github/actions/go-cache-keys
      with:
        go-version-file: ${{ inputs.go-version-file }}

    - name: Restore the Go toolchain
      if: inputs.cache == 'true' && inputs.cache-write != 'mod'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.keys.outputs.toolchain-path }}
        key: ${{ steps.keys.outputs.toolchain-key }}
        fail-on-cache-miss: true

    - name: Restore and save the Go toolchain
      if: inputs.cache == 'true' && inputs.cache-write == 'mod'
      uses: actions/cache@v4
      with:
        path: ${{ steps.keys.outputs.toolchain-path }}
        key: ${{ steps.keys.outputs.toolchain-key }}

    - uses: actions/setup-go@v6.0.0
      id: go
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: false

    - name: Restore module cache
      if: inputs.cache == 'true' && inputs.cache-write != 'mod'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.keys.outputs.mod-path }}
        key: ${{ steps.keys.outputs.mod-key }}
        restore-keys: ${{ steps.keys.outputs.mod-restore-key }}
        fail-on-cache-miss: true

    - name: Restore and save module cache
      if: inputs.cache == 'true' && inputs.cache-write == 'mod'
      uses: actions/cache@v4
      with:
        path: ${{ steps.keys.outputs.mod-path }}
        key: ${{ steps.keys.outputs.mod-key }}
        restore-keys: ${{ steps.keys.outputs.mod-restore-key }}

    - name: Restore build cache
      if: inputs.cache == 'true' && inputs.build-cache == 'true' && inputs.cache-write != 'build'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.keys.outputs.build-path }}
        key: ${{ steps.keys.outputs.build-key }}
        restore-keys: ${{ steps.keys.outputs.build-restore-key }}
        fail-on-cache-miss: true

    - name: Restore and save build cache
      if: inputs.cache == 'true' && inputs.cache-write == 'build'
      uses: actions/cache@v4
      with:
        path: ${{ steps.keys.outputs.build-path }}
        key: ${{ steps.keys.outputs.build-key }}
        restore-keys: ${{ steps.keys.outputs.build-restore-key }}

    - name: Report Go cache sizes
      if: inputs.cache == 'true'
      uses: ./.github/actions/report-go-cache-sizes
