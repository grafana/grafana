name: Setup Go
description: Sets up a Go environment with cache-friendly defaults for the Grafana repository.

inputs:
  go-version-file:
    description: Path to go.mod or go.work file for version detection.
    required: false
    default: 'go.mod'
  cache:
    description: Whether to restore the module and build caches.
    required: false
    default: 'true'
  build-cache:
    description: >-
      Whether this job wants the build cache as well as the module cache.
    required: false
    default: 'true'
  cache-write:
    description: >-
      Which cache this job may save: 'none', 'mod' or 'build'. Only the
      bootstrap workflows write, and each writes one of them, so no key has
      more than one writer. A GitHub cache entry cannot be rewritten, so a job
      that compiles little must not be able to claim a shared key.
    required: false
    default: 'none'

runs:
  using: "composite"
  steps:
    # The runner images cache a few Go releases, but not the one this repository
    # pins, so setup-go downloads the toolchain on every job. Restoring it into
    # the tool cache first means setup-go finds it and skips the download. The
    # version has to be read here rather than taken from setup-go's output,
    # because the cache is only useful before setup-go runs.
    - name: Read the pinned Go version
      if: inputs.cache == 'true'
      shell: bash
      run: |
        set -euo pipefail
        VERSION="$(awk '$1 == "go" { print $2; exit }' "${{ inputs.go-version-file }}")"
        echo "GO_TOOLCHAIN_VERSION=${VERSION}" >> "$GITHUB_ENV"
        echo "GO_TOOLCHAIN_KEY=gotoolchain-${RUNNER_OS}-${RUNNER_ARCH}-${VERSION}" >> "$GITHUB_ENV"

    - name: Restore the Go toolchain
      if: inputs.cache == 'true' && inputs.cache-write != 'mod'
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.tool_cache }}/go/${{ env.GO_TOOLCHAIN_VERSION }}
        key: ${{ env.GO_TOOLCHAIN_KEY }}

    - name: Restore and save the Go toolchain
      if: inputs.cache == 'true' && inputs.cache-write == 'mod'
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/go/${{ env.GO_TOOLCHAIN_VERSION }}
        key: ${{ env.GO_TOOLCHAIN_KEY }}

    - uses: actions/setup-go@v6.5.0
      id: go
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: false

    # Modules and build outputs are cached under separate keys. They have
    # different lifetimes: the module set changes only with the module files,
    # while build outputs differ with what each job compiles. Sharing one key
    # lets whichever job saves first decide the contents of both.
    - name: Compute Go cache keys
      if: inputs.cache == 'true'
      shell: bash
      run: |
        BASE="${RUNNER_OS}-${RUNNER_ARCH}-${GO_TOOLCHAIN_VERSION}"
        {
          echo "GO_MOD_CACHE_KEY=gomod-${BASE}-${{ hashFiles('**/*.mod', '**/*.sum') }}"
          echo "GO_MOD_CACHE_RESTORE_KEY=gomod-${BASE}-"
          echo "GO_BUILD_CACHE_KEY=gobuild-${BASE}-${{ hashFiles('**/*.mod', '**/*.sum') }}"
          echo "GO_BUILD_CACHE_RESTORE_KEY=gobuild-${BASE}-"
        } >> "$GITHUB_ENV"

    - name: Restore module cache
      if: inputs.cache == 'true' && inputs.cache-write != 'mod'
      uses: actions/cache/restore@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ env.GO_MOD_CACHE_KEY }}
        restore-keys: ${{ env.GO_MOD_CACHE_RESTORE_KEY }}

    - name: Restore and save module cache
      if: inputs.cache == 'true' && inputs.cache-write == 'mod'
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ env.GO_MOD_CACHE_KEY }}
        restore-keys: ${{ env.GO_MOD_CACHE_RESTORE_KEY }}

    - name: Restore build cache
      if: inputs.cache == 'true' && inputs.build-cache == 'true' && inputs.cache-write != 'build'
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/go-build
        key: ${{ env.GO_BUILD_CACHE_KEY }}
        restore-keys: ${{ env.GO_BUILD_CACHE_RESTORE_KEY }}

    - name: Restore and save build cache
      if: inputs.cache == 'true' && inputs.cache-write == 'build'
      uses: actions/cache@v4
      with:
        path: ~/.cache/go-build
        key: ${{ env.GO_BUILD_CACHE_KEY }}
        restore-keys: ${{ env.GO_BUILD_CACHE_RESTORE_KEY }}

    - name: Report Go cache sizes
      if: inputs.cache == 'true'
      uses: ./.github/actions/report-go-cache-sizes
