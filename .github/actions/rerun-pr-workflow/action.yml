name: Re-run PR workflow
description: Re-run a workflow for the current PR head. Requires actions write and pull-requests read permissions.

inputs:
  workflow:
    description: Workflow filename or ID to re-run.
    required: true
  token:
    description: GitHub token used to read PR metadata and re-run the workflow.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Re-run workflow for the current PR head
      uses: actions/github-script@v8
      env:
        GH_TOKEN: ${{ inputs.token }}
        WORKFLOW: ${{ inputs.workflow }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const { owner, repo } = context.repo;
          const { number, head } = context.payload.pull_request;

          async function isCurrent() {
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const current = pr.state === 'open' && pr.head.sha === head.sha;
            if (!current) {
              core.info('Skipping rerun: the PR is closed or the head changed.');
            }
            return current;
          }

          if (!await isCurrent()) return;

          const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
            owner, repo, workflow_id: process.env.WORKFLOW,
            event: 'pull_request', head_sha: head.sha, per_page: 100,
          });
          const run = runs.reduce((newest, candidate) => {
            const matches = candidate.pull_requests?.some(pr => pr.number === number && pr.head.sha === head.sha);
            return matches && (!newest || candidate.id > newest.id) ? candidate : newest;
          }, null);
          if (!run) {
            throw new Error('No workflow run found for this PR head. Retry after the initial run appears.');
          }

          // Let the caller's job timeout bound the wait without cancelling active tests.
          await exec.exec('gh', ['run', 'watch', String(run.id), '--repo', `${owner}/${repo}`]);
          if (!await isCurrent()) return;

          await github.rest.actions.reRunWorkflow({ owner, repo, run_id: run.id });
          core.info(`Requested full rerun of ${run.html_url}.`);
