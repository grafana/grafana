name: "Grafana Bundle Schema Types"
description: "Generates TypeScript types from the Grafana plugin schema and PRs them to plugin-extension-types."

outputs:
  typesFilePath:
    description: "Path to the generated types file (relative to the runner workspace)."
    value: ${{ steps.set-outputs.outputs.typesFilePath }}

runs:
  using: "composite"
  steps:
    - name: Check repository owner
      if: ${{ github.repository_owner != 'grafana' }}
      run: |
        echo "This action can only be run from within the Grafana organization."
        exit 1
      shell: bash

    - name: Get GitHub App token
      id: get-github-app-token
      uses: grafana/shared-workflows/actions/create-github-app-token@46f48da11e78ebdba7a8747ae456b11062fac83e # create-github-app-token/v0.3.1
      with:
        github_app: grafana-plugins-platform-bot

    - name: Clone plugin-extension-types
      run: |
        cd ..
        gh repo clone grafana/plugin-extension-types
      shell: bash
      env:
        GITHUB_TOKEN: ${{ steps.get-github-app-token.outputs.token }}

    - name: Generate TypeScript types
      working-directory: ${{ github.workspace }}
      env:
        PLUGIN_SCHEMA_TYPES_OUT: ../plugin-extension-types/types/plugin-schema/index.d.ts
      run: |
        mkdir -p ../plugin-extension-types/types/plugin-schema
        pnpm run gen-plugin-schema-types
        echo "Generated TypeScript types from plugin schema"
      shell: bash

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@67ccf781d68cd99b580ae25a5c18a1cc84ffff1f # 7.0.6
      with:
        base: main
        branch: grafana-plugins-platform-bot/update-plugin-schema-types
        commit-message: "types: updating plugin schema types"
        labels: |
          types-update
        path: ../plugin-extension-types
        sign-commits: true
        title: 'Chore: Update plugin schema types'
        token: '${{ steps.get-github-app-token.outputs.token }}'
        body: |
          Hello! 👋

          This PR was auto generated by the Grafana Bundle Schema Types action. [GitHub Action Job](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          **Notes for reviewer:**
          TypeScript types are generated from the Grafana plugin schema using `json-schema-to-typescript`.
          Please review the changes thoroughly before merging.

    - name: Set outputs
      id: set-outputs
      run: |
        echo "typesFilePath=../plugin-extension-types/types/plugin-schema/index.d.ts" >> "$GITHUB_OUTPUT"
      shell: bash
