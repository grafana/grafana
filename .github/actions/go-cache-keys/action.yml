name: Go cache keys
description: Computes shared Go module and build cache keys.

inputs:
  go-version-file:
    description: Path to go.mod or go.work for Go version detection.
    required: false
    default: go.mod

outputs:
  key:
    description: Cache key for current commit.
    value: ${{ steps.compute.outputs.key }}
  restore-key:
    description: Cache prefix for earlier commits using same toolchain.
    value: ${{ steps.compute.outputs.restore-key }}
  version:
    description: Pinned Go version.
    value: ${{ steps.compute.outputs.version }}

runs:
  using: composite
  steps:
    - id: compute
      shell: bash
      env:
        GO_VERSION_FILE: ${{ inputs.go-version-file }}
      run: |
        set -euo pipefail
        version="$(awk '$1 == "go" { print $2; exit }' "$GO_VERSION_FILE")"
        prefix="go-${RUNNER_OS}-${RUNNER_ARCH}-${version}-"
        {
          echo "key=${prefix}${GITHUB_SHA}"
          echo "restore-key=${prefix}"
          echo "version=${version}"
        } >> "$GITHUB_OUTPUT"
