# This workflow builds the Go binaries for the different architectures and operating systems to ensure that
# incoming pull requests are able to be compiled for all supported architectures and operating systems.
name: Build Go (matrix)

on:
  pull_request:
    paths:
      - '**/go.mod'
      - '**/go.sum'
      - '**/go.work'
      - '**/go.work.sum'
      - '**.go'
      - 'pkg/**'
      - 'apps/**'
      - Makefile
      - packaging/**
      - scripts/build-rpm.sh
      - scripts/build-deb.sh
      - scripts/build-targz.sh
      - scripts/verify-pkg-stig.sh
      - .github/actions/setup-go/**
      - .github/actions/setup-fpm/**
      - .github/actions/setup-enterprise/**
      - .github/workflows/build-go-matrix.yml
  push:
    branches:
      - main
      - release-*.*.*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions: {}

jobs:
  build-go:
    # Run on `grafana/grafana` pushes, or on pull requests, to prevent double-running on mirrors
    if: (github.event_name == 'pull_request' || (github.event_name == 'push' && github.repository == 'grafana/grafana'))
    name: Build Go (OSS, ${{ matrix.group }})
    runs-on: ubuntu-x64-large
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: windows
            targets: windows/amd64 windows/arm64
          - group: darwin
            targets: darwin/arm64 darwin/amd64
          - group: linux-arm-s390x
            targets: linux/arm/6 linux/arm/7 linux/s390x
          - group: linux-amd64-arm64
            targets: linux/amd64 linux/arm64
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
      GO_BUILD_TARGETS: ${{ matrix.targets }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          cache-build: 'false'
          cache-modules-save: ${{ matrix.group == 'linux-amd64-arm64' }}
      - name: Cache Go builds
        uses: actions/cache@v4 # zizmor: ignore[cache-poisoning] compile checks only; binaries are not published
        with:
          path: ${{ env.GOCACHE }}
          key: go-build-matrix-${{ runner.os }}-${{ runner.arch }}-oss-${{ matrix.group }}-${{ hashFiles('**/*.mod', '**/*.sum', 'go.work', 'go.work.sum') }}-${{ github.sha }}
          restore-keys: go-build-matrix-${{ runner.os }}-${{ runner.arch }}-oss-${{ matrix.group }}-${{ hashFiles('**/*.mod', '**/*.sum', 'go.work', 'go.work.sum') }}-
      - name: Build Go (${{ matrix.group }})
        env:
          CGO_ENABLED: "0"
        run: |
          build_and_verify() {
            make build-go || return 1
            local build_info
            build_info=$(go version -m "bin/$GOOS/$GOARCH/grafana$(go env GOEXE)") || return 1
            grep -Fx $'\tbuild\tGOOS='"$GOOS" <<< "$build_info" || return 1
            grep -Fx $'\tbuild\tGOARCH='"$GOARCH" <<< "$build_info" || return 1
            if [ -n "$GOARM" ]; then
              grep -E $'^\tbuild\tGOARM='"${GOARM}(,|$)" <<< "$build_info" || return 1
            fi
          }

          failed=()
          read -r -a targets <<< "$GO_BUILD_TARGETS"
          for target in "${targets[@]}"; do
            IFS=/ read -r GOOS GOARCH GOARM <<< "$target"
            export GOOS GOARCH GOARM
            echo "::group::Build Go ($target)"
            if ! build_and_verify; then
              echo "::error::Build or target verification ($target) failed"
              failed+=("$target")
            fi
            echo "::endgroup::"
          done
          if (( ${#failed[@]} )); then
            echo "Failed targets: ${failed[*]}"
            exit 1
          fi

  build-go-enterprise:
    # Run on pushes to `grafana/grafana` (not mirrors) OR for internal PRs (PRs not from forks)
    if: (github.event_name == 'push' && github.repository == 'grafana/grafana') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
    name: Build Go (enterprise, ${{ matrix.group }})
    runs-on: ubuntu-x64-large
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: windows
            targets: windows/amd64 windows/arm64
          - group: darwin
            targets: darwin/arm64 darwin/amd64
          - group: linux-arm-s390x
            targets: linux/arm/6 linux/arm/7 linux/s390x
          - group: linux-amd64-arm64
            targets: linux/amd64 linux/arm64
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
      GO_BUILD_TARGETS: ${{ matrix.targets }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Get GitHub App token
        id: get-github-app-token
        uses: grafana/shared-workflows/actions/create-github-app-token@46f48da11e78ebdba7a8747ae456b11062fac83e # create-github-app-token/v0.3.1
        with:
          github_app: grafana-ci-bot
      - name: Setup Enterprise
        uses: ./.github/actions/setup-enterprise
        with:
          token: ${{ steps.get-github-app-token.outputs.token }}
      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          cache-build: 'false'
          cache-modules-save: ${{ matrix.group == 'linux-amd64-arm64' }}
      - name: Cache Go builds
        uses: actions/cache@v4 # zizmor: ignore[cache-poisoning] compile checks only; binaries are not published
        with:
          path: ${{ env.GOCACHE }}
          key: go-build-matrix-${{ runner.os }}-${{ runner.arch }}-enterprise-${{ matrix.group }}-${{ hashFiles('**/*.mod', '**/*.sum', 'go.work', 'go.work.sum') }}-${{ github.sha }}
          restore-keys: go-build-matrix-${{ runner.os }}-${{ runner.arch }}-enterprise-${{ matrix.group }}-${{ hashFiles('**/*.mod', '**/*.sum', 'go.work', 'go.work.sum') }}-
      - name: Build Go (${{ matrix.group }})
        env:
          CGO_ENABLED: "0"
        run: |
          build_and_verify() {
            make build-go || return 1
            local build_info
            build_info=$(go version -m "bin/$GOOS/$GOARCH/grafana$(go env GOEXE)") || return 1
            grep -Fx $'\tbuild\tGOOS='"$GOOS" <<< "$build_info" || return 1
            grep -Fx $'\tbuild\tGOARCH='"$GOARCH" <<< "$build_info" || return 1
            if [ -n "$GOARM" ]; then
              grep -E $'^\tbuild\tGOARM='"${GOARM}(,|$)" <<< "$build_info" || return 1
            fi
          }

          failed=()
          read -r -a targets <<< "$GO_BUILD_TARGETS"
          for target in "${targets[@]}"; do
            IFS=/ read -r GOOS GOARCH GOARM <<< "$target"
            export GOOS GOARCH GOARM
            echo "::group::Build Go ($target)"
            if ! build_and_verify; then
              echo "::error::Build or target verification ($target) failed"
              failed+=("$target")
            fi
            echo "::endgroup::"
          done
          if (( ${#failed[@]} )); then
            echo "Failed targets: ${failed[*]}"
            exit 1
          fi

  # TODO: Build rpm in another workflow
  verify-rpm-stig:
    # Run on `grafana/grafana` pushes, or on pull requests, to prevent double-running on mirrors
    if: (github.event_name == 'pull_request' || (github.event_name == 'push' && github.repository == 'grafana/grafana'))
    name: verify rpm stig (linux/amd64)
    runs-on: ubuntu-x64-large
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: grafana/shared-workflows/actions/dockerhub-login@dockerhub-login/v1.0.2
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-fpm
      - name: Create stub artifacts
        run: |
          mkdir -p bin/linux/amd64 public/build data/plugins-bundled
          printf '#!/bin/sh\nexec true\n' > bin/linux/amd64/grafana
          chmod 0755 bin/linux/amd64/grafana
          touch data/plugins-bundled/.platform-linux-amd64.stamp
      - name: Build tar.gz
        env:
          GOOS: linux
          GOARCH: amd64
          BUILD_VERSION: '0.0.0'
          BUILD_NUMBER: stig-test
        run: make build-targz BUILD_VERSION="$BUILD_VERSION" BUILD_NUMBER="$BUILD_NUMBER"
      - name: Build RPM
        env:
          GOOS: linux
          GOARCH: amd64
          BUILD_VERSION: '0.0.0'
          BUILD_NUMBER: stig-test
        run: make build-rpm BUILD_VERSION="$BUILD_VERSION" BUILD_NUMBER="$BUILD_NUMBER"
      - name: Verify RPM permissions (DISA-STIG)
        run: bash scripts/verify-pkg-stig.sh dist/grafana_0.0.0_stig-test_linux_amd64.rpm
