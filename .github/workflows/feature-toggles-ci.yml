name: Feature toggles CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  detect-changes:
    # Run on `grafana/grafana` main branch, or on pull requests to prevent double-running on mirrors
    if: (github.event_name == 'pull_request' || (github.event_name == 'push' && github.repository == 'grafana/grafana'))
    name: Detect whether code changed
    runs-on: ubuntu-arm64-small
    permissions:
      contents: read
    outputs:
      changedbackend: ${{ steps.detect-changes.outputs.backend }}
      changeddocs: ${{ steps.detect-changes.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true # required to get more history in the changed-files action
          fetch-depth: 0
          filter: blob:none
      - name: Detect changes
        id: detect-changes
        uses: ./.github/actions/change-detection
        with:
          self: .github/workflows/feature-toggles-ci.yml

  go-mod-cache:
    needs: detect-changes
    if: needs.detect-changes.outputs.changedbackend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/bootstrap-go-mod-cache.yml
    with:
      runs-on: ubuntu-x64

  go-build-cache:
    needs: go-mod-cache
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/bootstrap-go-build-cache.yml
    with:
      runs-on: ubuntu-x64

  test:
    needs: [detect-changes, go-build-cache]
    if: needs.detect-changes.outputs.changedbackend == 'true' || needs.detect-changes.outputs.changeddocs == 'true'

    name: Feature toggles documentation is in sync with source

    runs-on: ubuntu-x64

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Run feature toggle tests
        run: go test -v -run TestFeatureToggleFiles ./pkg/services/featuremgmt/
