name: Check plugin-compat pull request title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - 'packages/grafana-plugin-compat/**'
      - '.github/workflows/pr-check-plugin-compat-title.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  title-check:
    name: Check plugin-compat pull request title
    # The release PR bumps the version and writes the changelog, so it never triggers a release of its own.
    if: github.event.pull_request.draft == false && github.head_ref != 'nx-release-branch--main'
    runs-on: ubuntu-x64-small
    permissions: {}
    steps:
      # nx release reads the squash-merged title to decide the version bump. The scope is optional, but
      # nx drops the breaking marker when the scope is not the project, so feat(other)!: releases as a
      # minor change. A breaking title therefore takes no scope or the package's own name.
      - name: Check title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|build|types|chore|examples|test|style|ci|revert)(\(([^)]+)\))?(!)?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::Pull requests that change @grafana/plugin-compat must use a conventional commit title, such as 'feat: Add useThing', 'fix(plugin-compat): ...' or 'feat!: ...' for a breaking change. The title decides the next version. See \"Independent packages\" in packages/README.md."
            exit 1
          fi
          scope="${BASH_REMATCH[3]}"
          breaking="${BASH_REMATCH[4]}"
          if [ -n "$breaking" ] && [ -n "$scope" ] && [ "$scope" != 'plugin-compat' ] && [ "$scope" != '@grafana/plugin-compat' ]; then
            echo "::error::A breaking change title can only have the scope plugin-compat or no scope, but this one has the scope '$scope'. nx release would release it without the breaking change. Use 'feat!: ...' or 'feat(plugin-compat)!: ...'."
            exit 1
          fi
          echo "Title is a valid conventional commit for plugin-compat."
