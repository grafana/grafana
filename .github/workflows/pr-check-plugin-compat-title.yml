name: Check plugin-compat pull request title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - 'packages/grafana-plugin-compat/**'
      - '.github/workflows/pr-check-plugin-compat-title.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  title-check:
    name: Check plugin-compat pull request title
    # The release PR bumps the version and writes the changelog, so it never triggers a release of its own.
    if: github.event.pull_request.draft == false && github.head_ref != 'nx-release-branch--main'
    runs-on: ubuntu-x64-small
    permissions: {}
    steps:
      # nx release reads the squash-merged title to decide the version bump. A scope is rejected because
      # one that does not match the project makes nx count the change as a patch, even a breaking one.
      # chore(deps) is the one allowed scope because Renovate titles its pull requests that way, and
      # a chore never releases.
      - name: Check title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^((feat|fix|perf|refactor|docs|build|types|chore|examples|test|style|ci|revert)!?|chore\(deps(-dev)?\)): .+'
          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "Title is a valid conventional commit for plugin-compat."
            exit 0
          fi
          echo "::error::Pull requests that change @grafana/plugin-compat must use a conventional commit title without a scope, such as 'feat: Add useThing', 'fix: ...' or 'feat!: ...' for a breaking change. The title decides the next version. See \"Independent packages\" in packages/README.md."
          exit 1
