name: External PR Status Trigger

# Fires when a triaged external PR is assigned, reviewed, closed or merged, and
# hands the PR number to the handler, which updates the PR's Slack card.

on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types: [assigned, unassigned, closed, reopened]
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

concurrency:
  group: status-pr-trigger-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  capture:
    name: Capture PR number for handler
    runs-on: ubuntu-arm64-small
    permissions: {}
    # Only PRs that already have a card.
    if: |
      contains(github.event.pull_request.labels.*.name, 'pr/auto-triaged') &&
      contains(fromJSON('["NONE", "FIRST_TIME_CONTRIBUTOR", "FIRST_TIMER", "CONTRIBUTOR"]'), github.event.pull_request.author_association)

    steps:
      - name: Save PR number for handler workflow
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          printf '%s\n' "$PR_NUMBER" > pr-number.txt
          printf '%s\n' "$EVENT_ACTION" > event-action.txt
          echo "PR number: $(cat pr-number.txt)"

      - name: Upload PR number
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: pr-number
          path: |
            pr-number.txt
            event-action.txt
          retention-days: 1
