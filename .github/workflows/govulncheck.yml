name: govulncheck

on:
  push:
    paths:
      - '**/*.go'
      - .github/workflows/govulncheck.yml
      - .citools/src/govulncheck/**
      - go.*
    branches:
      - main
  pull_request:
    paths:
      - '**/*.go'
      - .github/workflows/govulncheck.yml
      - .citools/src/govulncheck/**
      - go.*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  govulncheck:
    # Run on `grafana/grafana` pushes, or on pull requests, to prevent double-running on mirrors
    if: (github.event_name == 'pull_request' || (github.event_name == 'push' && github.repository == 'grafana/grafana'))
    runs-on: ubuntu-x64-large
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          cache-build: 'false'
      - name: Run govulncheck on all modules
        run: |
          set -euo pipefail

          GOVULNCHECK=$(GOWORK=off go tool -n -modfile="$GITHUB_WORKSPACE/.citools/src/govulncheck/go.mod" govulncheck)

          echo "::notice::Ignoring GO-2026-6443 only for patched google.golang.org/grpc@v1.84.0 until the Go vulnerability database is corrected."

          failed=0
          for dir in $(go list -m -f '{{.Dir}}'); do
            [ -f "$dir/.nolint" ] && continue
            # JSON mode does not fail on findings; convert restores govulncheck's exit status.
            if output=$(
              {
                cd "$dir" &&
                  "$GOVULNCHECK" -json ./... |
                  jq -c 'select((
                    .finding.osv == "GO-2026-6443" and
                    .finding.trace[0].module == "google.golang.org/grpc" and
                    .finding.trace[0].version == "v1.84.0"
                  ) | not)' |
                  "$GOVULNCHECK" -mode=convert
              } 2>&1
            ); then
              echo "ok $dir"
            else
              echo ""
              echo "=== FAIL $dir ==="
              echo "$output"
              echo "=== END $dir ==="
              echo ""
              failed=1
            fi
          done
          exit $failed
