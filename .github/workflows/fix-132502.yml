name: apply-table-pagination-fix

on:
  push:
    branches:
      - fix/132502-table-pagination-flicker

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align pagination grid reservation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/grafana-ui/src/components/Table/TableNG/styles.ts')
          s = p.read_text()
          old = "blockSize: enablePagination ? 'calc(100% - 32px)' : '100%',"
          new = "blockSize: enablePagination ? 'calc(100% - 38px)' : '100%',"
          if old not in s:
              raise SystemExit('expected pagination blockSize not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/grafana-ui/src/components/Table/TableNG/styles.ts
          git commit -m 'fix(table): align pagination grid height reservation'
          git push
