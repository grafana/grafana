name: End-to-end tests label dispatcher

# Adding the `run full tests` label re-runs the pr-e2e-tests.yml run for the
# PR's head commit so a draft PR gets E2E results without a new push. Kept out
# of that file on purpose: policy-bot judges the latest completed run of a
# workflow for the commit, so a `labeled` trigger there would let any unrelated
# label create a skipped run that hides a real E2E result. Re-running reuses
# the existing run instead.
on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  rerun-e2e-tests:
    # Fork PRs are not supported: a rerun needs `actions: write`, which the
    # token does not get for fork-triggered runs.
    if: github.event.label.name == 'run full tests' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-arm64-small
    timeout-minutes: 30
    permissions:
      actions: write
    steps:
      - name: Re-run the end-to-end tests for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_id=$(gh api "repos/${REPO}/actions/workflows/pr-e2e-tests.yml/runs?event=pull_request&head_sha=${HEAD_SHA}&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [[ -z "${run_id}" ]]; then
            echo "::error::No end-to-end tests run found for ${HEAD_SHA}. Remove and re-add the label once it exists."
            exit 1
          fi
          # A run still in progress may have read the labels before this one was added.
          gh run watch "${run_id}" --repo "${REPO}" > /dev/null || true
          gh api --method POST "repos/${REPO}/actions/runs/${run_id}/rerun"
          echo "Re-ran https://github.com/${REPO}/actions/runs/${run_id}"
