name: golangci-lint
on:
  workflow_call:
    inputs:
      backend:
        description: Whether backend code changed.
        required: true
        type: string

permissions:
  contents: read

jobs:

  go-fmt:
    if: inputs.backend == 'true'
    runs-on: ubuntu-x64
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          cache: 'false'
      - name: Run gofmt
        run: |
          GOFMT="$(go list -m -f '{{.Dir}}' | xargs -I{} sh -c 'test ! -f {}/.nolint && echo {}' | xargs gofmt -s -e -l 2>&1 | grep -v '/pkg/build/' || true)"
          if [ -n "$GOFMT" ]; then
            echo "Found files that are not gofmt'ed"
            echo "Run 'gofmt -s -w .' or 'make gofmt' or install the pre-commit hook with 'make lefthook-install'"
            echo "${GOFMT}"
            exit 1
          fi

  lint-go:
    if: inputs.backend == 'true'
    runs-on: ubuntu-x64-xlarge
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          build-cache: 'false'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.12.2
          args: |
            --verbose $(go list -m -f '{{.Dir}}' | xargs -I{} sh -c 'test ! -f {}/.nolint && echo {}/...')
          install-mode: binary
