name: Deploy frontend preview

# Triggered by commenting /deploy-to-fs, builds the frontend of the pull
# request and uploads it to the preview assets bucket, to use with the new
# frontend PR preview feature
#
# The status comment warns that the preview does not include backend changes.

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [synchronize]

permissions: {}

jobs:
  check:
    name: Check PR is eligible
    # Fork previews require a new trusted comment for each build. Only PRs
    # from this repository can opt in to automatic deploys with the label.
    if: |
      github.repository == 'grafana/grafana' &&
      (
        (github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          startsWith(github.event.comment.body, '/deploy-to-fs') &&
          (github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'OWNER')) ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.labels.*.name, 'deploy-frontend-preview'))
      )
    runs-on: ubuntu-arm64-small
    permissions:
      issues: write
      pull-requests: write
    outputs:
      pr-number: ${{ steps.check.outputs.pr-number }}
      head-sha: ${{ steps.check.outputs.head-sha }}
      is-fork: ${{ steps.check.outputs.is-fork }}
      has-backend-changes: ${{ steps.check.outputs.has-backend-changes }}
    steps:
      - name: Check PR is eligible for a frontend preview
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # Forks require a fresh /deploy-to-fs comment from a user account, not a bot or a rerun.
          ALLOW_FORK: ${{ github.event_name == 'issue_comment' && github.run_attempt == 1 && github.event.comment.user.type == 'User' }}
        run: |
          set -euo pipefail

          pr=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")

          head_sha=$(jq -er '.head.sha' <<< "$pr")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<< "$pr")

          is_fork=true
          if [ "$head_repo" = "$REPO" ]; then
            is_fork=false
          elif [ -z "$head_repo" ] || [ "$ALLOW_FORK" != "true" ]; then
            exit 0
          fi

          # A preview only swaps out the frontend assets served by an existing
          # instance, so backend changes in the PR would not be reflected.
          has_backend_changes=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --slurp |
            jq 'any(.[][]; .filename | startswith("pkg/"))')

          {
            echo "has-backend-changes=${has_backend_changes}"
            echo "pr-number=${PR_NUMBER}"
            echo "head-sha=${head_sha}"
            echo "is-fork=${is_fork}"
          } >> "$GITHUB_OUTPUT"

          echo "PR #${PR_NUMBER}: head-sha=${head_sha}, is-fork=${is_fork}, has-backend-changes=${has_backend_changes}"

      - name: Add label and acknowledge comment
        if: github.event_name == 'issue_comment' && steps.check.outputs.head-sha != ''
        # An acknowledgement failure must not block the preview build.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.check.outputs.pr-number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          IS_FORK: ${{ steps.check.outputs.is-fork }}
        run: |
          if [ "$IS_FORK" = "false" ]; then
            gh api "repos/${REPO}/issues/${PR_NUMBER}/labels" -f "labels[]=deploy-frontend-preview"
          fi
          gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" -f content=rocket

      - name: Comment that the build is queued
        if: steps.check.outputs.head-sha != ''
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: frontend-preview
          number: ${{ steps.check.outputs.pr-number }}
          GITHUB_TOKEN: ${{ github.token }}
          message: |
            ### Frontend preview

            ⏳ The preview build for commit ${{ steps.check.outputs.head-sha }} is queued.

            ${{ steps.check.outputs.has-backend-changes == 'true' && '⚠️ **Warning:** this PR contains backend changes. The preview only swaps the frontend assets of an existing instance, so it may not work correctly.' || '' }}

  build:
    name: Build frontend
    needs: check
    if: needs.check.outputs.head-sha != '' && (needs.check.outputs.is-fork == 'false' || github.run_attempt == 1)
    runs-on: ubuntu-x64-large
    # A newer eligible request cancels a stale build without interrupting an upload.
    concurrency:
      group: ${{ github.workflow }}-build-${{ needs.check.outputs.pr-number }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Checkout trusted Node.js version
        if: needs.check.outputs.is-fork == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .nvmrc
          sparse-checkout-cone-mode: false
          path: preview-config
          persist-credentials: false
      - name: Checkout PR code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.check.outputs.head-sha }}
          path: ${{ needs.check.outputs.is-fork == 'true' && 'preview-source' || '.' }}
          persist-credentials: false
      - name: Set up Node.js
        if: needs.check.outputs.is-fork == 'false'
        # Only the internal build uses local actions from the checkout.
        uses: ./.github/actions/setup-node
      - name: Restore or build frontend
        if: needs.check.outputs.is-fork == 'false'
        uses: ./.github/actions/build-frontend
        with:
          sourcemaps: 'false'

      # issue_comment runs in the default branch's cache scope. Do not expose
      # runner credentials, cache APIs, or workflow command files to fork code.
      - name: Build fork frontend in a container
        if: needs.check.outputs.is-fork == 'true'
        timeout-minutes: 60
        shell: bash
        run: |
          node_version=$(<preview-config/.nvmrc)
          [[ "$node_version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]
          image="node:${node_version#v}-bookworm"
          mkdir dist

          # Treat output from the container as logs, not workflow commands.
          marker=$(openssl rand -hex 16)
          echo "::stop-commands::$marker"
          trap 'echo "::$marker::"' EXIT
          docker run --rm \
            --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$GITHUB_WORKSPACE/preview-source,dst=/checkout,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/dist,dst=/out" \
            --env HOME=/tmp --env CI=true --env NO_SOURCEMAP=1 \
            --env PUPPETEER_SKIP_DOWNLOAD=true --env CYPRESS_INSTALL_BINARY=0 \
            --entrypoint bash "$image" -ec '
              # Keep the host checkout intact for the post-build cleanup.
              cp -RP /checkout /tmp/src
              cd /tmp/src
              manager=$(node -p "require(\"./package.json\").packageManager")
              npm exec --yes --package="$manager" -- bash -ec "
                pnpm install --frozen-lockfile
                make build-js
              "
              cp -a dist/frontend /out/
            '

      - name: Check fork artifact contains only regular files
        if: needs.check.outputs.is-fork == 'true'
        shell: bash
        run: |
          # Artifact upload follows links. Check ancestors before traversing.
          for dir in dist dist/frontend; do
            if [[ -L "$dir" || ! -d "$dir" ]]; then
              echo "Invalid fork artifact directory"
              exit 1
            fi
          done
          invalid=$(find dist/frontend ! -type f ! -type d -print -quit)
          if [[ -n "$invalid" ]]; then
            echo "Fork artifact contains a link or a special file"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: frontend-preview-build
          path: dist/frontend/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy preview assets
    # Uploads from a separate job so the OIDC-enabled step never runs
    # alongside code built from the PR.
    needs: [check, build]
    if: needs.check.outputs.is-fork == 'false' || github.run_attempt == 1
    runs-on: ubuntu-arm64-small
    # Never cancel an in-flight upload. Newer deploys queue behind it; GitHub
    # keeps only the newest pending job in the group.
    concurrency:
      group: ${{ github.workflow }}-deploy-${{ needs.check.outputs.pr-number }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # required for push-to-gcs
      pull-requests: write # to update the status comment
    env:
      BUCKET_NAME: grafana-frontend-preview-dev
      PREVIEW_STACK_URL: https://frontendpreview.grafana-dev.net
    # The environment surfaces the preview URL on the PR
    environment:
      name: "frontend-preview-pr-${{ needs.check.outputs.pr-number }}"
      url: ${{ steps.preview-url.outputs.url }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: frontend-preview-build
          path: dist/frontend

      # The deploy name is the folder users put in the preview assets cookie.
      # It must match the backend's validation: alphanumeric and underscores
      # only. It is stable across pushes so an already-set cookie picks up new
      # builds of the same PR.
      - name: Create deploy name
        id: deploy-name
        env:
          PR_NUMBER: ${{ needs.check.outputs.pr-number }}
        run: echo "deploy-name=pr_grafana_${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      # Upload the assets manifest last to help make uploads more atomic.
      - name: Stage manifests to upload last
        env:
          IS_FORK: ${{ needs.check.outputs.is-fork }}
        run: |
          mkdir -p preview-manifest
          if [ "$IS_FORK" = "true" ]; then
            manifest=dist/frontend/build/assets-manifest.json
            test -f "$manifest"
            test ! -L "$manifest"
            test "$(wc -c < "$manifest")" -le 10485760
            jq -es 'length == 1 and (.[0] | type == "object")' "$manifest" > /dev/null
          fi
          mv dist/frontend/build/assets-manifest*.json preview-manifest/

      - name: Upload assets (manifests excluded)
        uses: grafana/shared-workflows/actions/push-to-gcs@main
        with:
          environment: dev
          bucket: ${{ env.BUCKET_NAME }}
          bucket_path: ${{ steps.deploy-name.outputs.deploy-name }}/public
          path: dist/frontend
          service_account: github-gf-frontend-preview-dev@grafanalabs-workload-identity.iam.gserviceaccount.com
          parent: false
          # The action's default ACL is rejected by the bucket's uniform
          # bucket-level access. Public read comes from an IAM binding instead.
          predefinedAcl: ""

      - name: Upload manifests to switch the preview to this build
        uses: grafana/shared-workflows/actions/push-to-gcs@main
        with:
          environment: dev
          bucket: ${{ env.BUCKET_NAME }}
          bucket_path: ${{ steps.deploy-name.outputs.deploy-name }}/public/build
          path: preview-manifest
          service_account: github-gf-frontend-preview-dev@grafanalabs-workload-identity.iam.gserviceaccount.com
          parent: false
          predefinedAcl: ""

      - name: Set preview URL
        id: preview-url
        env:
          DEPLOY_NAME: ${{ steps.deploy-name.outputs.deploy-name }}
        run: |
          echo "url=${PREVIEW_STACK_URL}/-/set-preview-assets?assets=${DEPLOY_NAME}" >> "$GITHUB_OUTPUT"

      - name: Write summary
        env:
          DEPLOY_NAME: ${{ steps.deploy-name.outputs.deploy-name }}
          HEAD_SHA: ${{ needs.check.outputs.head-sha }}
          PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
          IS_FORK: ${{ needs.check.outputs.is-fork }}
        run: |
          {
            echo "## Frontend preview deployed 🚀"
            echo ""
            echo "- Deploy name: \`${DEPLOY_NAME}\` (commit ${HEAD_SHA})"
            echo "- Load it at: ${PREVIEW_URL}"
            if [ "$IS_FORK" = "true" ]; then
              echo "- This preview runs fork code in your session on the preview stack."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update comment to say the preview is live
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: frontend-preview
          number: ${{ needs.check.outputs.pr-number }}
          GITHUB_TOKEN: ${{ github.token }}
          message: |
            ### Frontend preview

            ✅ The preview for commit ${{ needs.check.outputs.head-sha }} is live: **[open the preview](${{ steps.preview-url.outputs.url }})**.

            ${{ needs.check.outputs.is-fork == 'true' && '- This preview runs fork code in your session on the preview stack. Open it only if you trust the commit listed above.' || '- Each new push to this PR builds and deploys the preview again automatically.' }}
            ${{ needs.check.outputs.is-fork == 'true' && '- A member or owner of the Grafana GitHub organization must comment `/deploy-to-fs` again to build and deploy a newer commit.' || '- Share the above link for others to preview it in their browsers too.' }}

            ${{ needs.check.outputs.has-backend-changes == 'true' && '⚠️ **Warning:** this PR contains backend changes. The preview only swaps the frontend assets of an existing instance, so it may not work correctly.' || '' }}

  comment-failure:
    name: Comment that the deploy failed
    needs: [check, build, deploy]
    if: failure() && needs.check.outputs.head-sha != ''
    runs-on: ubuntu-arm64-small
    permissions:
      pull-requests: write
    steps:
      - name: Update comment to say the deploy failed
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: frontend-preview
          number: ${{ needs.check.outputs.pr-number }}
          GITHUB_TOKEN: ${{ github.token }}
          message: |
            ### Frontend preview

            ❌ The preview deploy for commit ${{ needs.check.outputs.head-sha }} failed. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

  comment-cancelled:
    name: Comment that the deploy was cancelled
    needs: [check, build, deploy]
    # failure() does not match cancelled jobs, so without this a cancelled run
    # would leave the sticky comment saying the build is in progress forever.
    if: |
      always() && needs.check.outputs.head-sha != '' &&
      !contains(needs.*.result, 'failure') &&
      contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-arm64-small
    permissions:
      pull-requests: write
    steps:
      - name: Update comment to say the deploy was cancelled
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: frontend-preview
          number: ${{ needs.check.outputs.pr-number }}
          GITHUB_TOKEN: ${{ github.token }}
          message: |
            ### Frontend preview

            ⚠️ The preview deploy for commit ${{ needs.check.outputs.head-sha }} was cancelled ([workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})). If a newer request superseded it, that run will update this comment when it finishes. Any previously deployed preview is still live.
