name: Check Frontend Test Coverage

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.ts'
      - '**/*.tsx'
      - 'package.json'
      - '.github/CODEOWNERS'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  setup:
    name: Setup opted-in teams
    runs-on: ubuntu-x64-small
    outputs:
      # NOTE: Only checks test coverage for opted-in codeowners.
      #       Please add the GitHub user/team or email used in
      #       CODEOWNERS to the list below to opt-in.
      opted-in-teams: >-
        [
          "@grafana/datapro",
          "@grafana/dataviz-squad",
          "@grafana/grafana-operator-experience-squad",
          "@grafana/grafana-frontend-navigation"
        ]
    steps:
      - name: Define opted-in teams
        run: echo "Opted-in teams defined in job outputs"

  detect-changes:
    name: Detect changed files
    runs-on: ubuntu-x64-small
    permissions:
      contents: read
    outputs:
      changed-files: ${{ steps.changed-files.outputs.all_changed_files }}
      main-sha: ${{ steps.get-main-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Get main SHA
        id: get-main-sha
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE_REF"
          MAIN_SHA=$(git rev-parse "origin/$BASE_REF")
          echo "sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "Main branch SHA: $MAIN_SHA"

      - name: Detect changed files
        id: changed-files
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323 # v47.0.5
        with:
          separator: ' '

      - name: Display changed files
        run: |
          echo "=== Changed Files Detected ==="
          echo "${{ steps.changed-files.outputs.all_changed_files }}"
          echo "=============================="

  coverage:
    name: Coverage - ${{ matrix.codeowner }}
    needs: [setup, detect-changes]
    if: "!contains(github.event.pull_request.labels.*.name, 'no-check-frontend-test-coverage')"
    runs-on: ubuntu-x64-large
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        codeowner: ${{ fromJSON(needs.setup.outputs.opted-in-teams) }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          path: './pr'
          persist-credentials: false

      - name: Setup Node.js for manifest generation
        uses: ./pr/.github/actions/setup-node
        with:
          cwd: './pr'

      - name: Install dependencies for manifest generation
        uses: ./pr/.github/actions/yarn-install
        with:
          cwd: './pr'

      - name: Generate codeowners manifest
        working-directory: './pr'
        run: yarn codeowners-manifest

      - name: Check if codeowner affected by changes
        id: check-affected
        working-directory: './pr'
        run: |
          AFFECTED=$(node scripts/check-codeowner-affected.js "${{ matrix.codeowner }}" "${{ needs.detect-changes.outputs.changed-files }}")
          echo "affected=$AFFECTED" >> "$GITHUB_OUTPUT"
          echo "Codeowner ${{ matrix.codeowner }} affected: $AFFECTED"

      - name: Get codeowner coverage directory slug
        id: coverage-dir
        working-directory: './pr'
        run: |
          SLUG=$(node -e "
            const {createCodeownerSlug} = require('./scripts/codeowners-manifest/utils.js');
            console.log(createCodeownerSlug('${{ matrix.codeowner }}'));
          ")
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
          PATH=$(node -e "
            const {buildCodeownerDirectoryPath} = require('./scripts/codeowners-manifest/utils.js');
            console.log(buildCodeownerDirectoryPath('${{ matrix.codeowner }}'));
          ")
          echo "path=${PATH}" >> "$GITHUB_OUTPUT"

      - name: Write not-affected result
        if: steps.check-affected.outputs.affected == 'false'
        run: |
          echo '{"team": "${{ matrix.codeowner }}", "affected": false}' > ./coverage-comparison.json

      - name: Checkout main branch
        if: steps.check-affected.outputs.affected == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.detect-changes.outputs.main-sha }}
          path: './main'
          persist-credentials: false

      - name: Setup Node.js for main branch
        if: steps.check-affected.outputs.affected == 'true'
        uses: ./pr/.github/actions/setup-node
        with:
          cwd: './main'

      - name: Install dependencies for main branch
        if: steps.check-affected.outputs.affected == 'true'
        uses: ./pr/.github/actions/yarn-install
        with:
          cwd: './main'

      - name: Run coverage for main branch
        if: steps.check-affected.outputs.affected == 'true'
        working-directory: './main'
        run: yarn test:coverage:by-codeowner "${{ matrix.codeowner }}" --maxWorkers=1
        env:
          SHOULD_OPEN_COVERAGE_REPORT: 'false'
          CI: 'true'
          GITHUB_SHA: ${{ needs.detect-changes.outputs.main-sha }}

      - name: Save main coverage summary
        if: steps.check-affected.outputs.affected == 'true'
        run: mkdir -p ./coverage-main && cp ./main/coverage-summary.json ./coverage-main/coverage-summary.json

      - name: Run coverage for PR branch
        if: steps.check-affected.outputs.affected == 'true'
        working-directory: './pr'
        run: yarn test:coverage:by-codeowner "${{ matrix.codeowner }}" --maxWorkers=1
        env:
          SHOULD_OPEN_COVERAGE_REPORT: 'false'
          CI: 'true'
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Save PR coverage summary
        if: steps.check-affected.outputs.affected == 'true'
        run: mkdir -p ./coverage-pr && cp ./pr/coverage-summary.json ./coverage-pr/coverage-summary.json

      - name: Upload PR HTML coverage report
        if: steps.check-affected.outputs.affected == 'true'
        id: upload-coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ steps.coverage-dir.outputs.slug }}
          path: ./pr/coverage/by-team/${{ steps.coverage-dir.outputs.path }}/html
          retention-days: 7

      - name: Compare coverage
        if: steps.check-affected.outputs.affected == 'true'
        id: compare
        env:
          COVERAGE_ARTIFACT_URL: ${{ steps.upload-coverage.outputs.artifact-url }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # Run comparison from workspace root where coverage-main/ and coverage-pr/ live.
          # This writes ./coverage-comparison.json, fanned in by the "coverage-summary"
          # job below into one detailed report instead of a per-team PR comment.
          if node ./pr/scripts/compare-coverage-by-codeowner.js; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      # Uploaded unconditionally (affected or not) so the fan-in summary can report
      # on every opted-in team, not just the ones with a comparison to show. If an
      # earlier step (install, tests, HTML upload) failed before writing
      # coverage-comparison.json, synthesize an "error" result instead of letting
      # this team silently disappear from the summary.
      - name: Rename coverage result for fan-in
        if: always()
        run: |
          if [ ! -f ./coverage-comparison.json ]; then
            echo '{"team": "${{ matrix.codeowner }}", "affected": true, "status": "error", "runLocallyCommand": "yarn test:coverage:by-codeowner ${{ matrix.codeowner }}"}' > ./coverage-comparison.json
          fi
          mv ./coverage-comparison.json ./coverage-result-${{ steps.coverage-dir.outputs.slug }}.json

      - name: Upload coverage result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-result-${{ steps.coverage-dir.outputs.slug }}
          path: ./coverage-result-${{ steps.coverage-dir.outputs.slug }}.json
          retention-days: 7

      - name: Fail if coverage decreased
        if: steps.check-affected.outputs.affected == 'true' && steps.compare.outputs.passed == 'false'
        run: |
          echo "❌ Coverage check failed for ${{ matrix.codeowner }}"
          exit 1

  coverage-summary:
    name: All coverage checks pass
    needs: [setup, coverage]
    if: always()
    runs-on: ubuntu-x64-small
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check if skipped
        id: check-skip
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'no-check-frontend-test-coverage') }}" == "true" ]]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "✅ Coverage checks skipped due to 'no-check-frontend-test-coverage' label"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
            echo "All opted-in teams' coverage checks have completed."
          fi

      - name: Write skip summary
        if: steps.check-skip.outputs.skipped == 'true'
        env:
          TEAMS: ${{ needs.setup.outputs.opted-in-teams }}
        run: |
          {
            echo "# Frontend Test Coverage Summary"
            echo
            echo "## ⚠️ Skipped via the \`no-check-frontend-test-coverage\` label"
            echo
            echo "Coverage checks were skipped for the following opted-in codeowners:"
            echo
            echo "$TEAMS" | jq -r '.[] | "- `" + . + "`"'
            echo
            echo "🚨 **Skip label:** remove the \`no-check-frontend-test-coverage\` label from this PR to re-enable coverage checks."
          } >> "$GITHUB_STEP_SUMMARY"

      # Checkout runs before downloading artifacts because actions/checkout cleans
      # the workspace (git clean -ffdx) — doing it after would wipe coverage-results.
      - name: Checkout for fan-in script
        if: steps.check-skip.outputs.skipped == 'false'
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/generate-coverage-run-summary.js
            scripts/compare-coverage-by-codeowner.js
          sparse-checkout-cone-mode: false

      - name: Download coverage results
        if: steps.check-skip.outputs.skipped == 'false'
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-result-*
          path: ./coverage-results
          merge-multiple: true

      - name: Write coverage summary
        if: steps.check-skip.outputs.skipped == 'false'
        run: node scripts/generate-coverage-run-summary.js ./coverage-results >> "$GITHUB_STEP_SUMMARY"

      - name: Verify all checks passed
        if: steps.check-skip.outputs.skipped == 'false'
        run: |
          if [[ "${{ needs.coverage.result }}" != "success" ]]; then
            echo "❌ Coverage checks failed for one or more teams — see the job summary above for details."
            exit 1
          fi
          echo "✅ All coverage metrics were maintained, improved, or within tolerance."
