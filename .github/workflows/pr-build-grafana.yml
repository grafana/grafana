name: PR build Docker image

on:
  pull_request:
    # Include ready_for_review so the draft gate below re-evaluates when a draft
    # is marked ready without a new push (default types omit that event).
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

# for meticulous tests
permissions: {}

jobs:
  detect-changes:
    # Keep validation available to forks while skipping draft PRs entirely.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Detect whether code changed
    runs-on: ubuntu-x64-small
    permissions:
      contents: read
    outputs:
      # Include Docker build inputs as well as non-test frontend and backend changes.
      changed: ${{ steps.detect-changes.outputs.docker-build == 'true' ||
        steps.detect-changes.outputs.frontend-src == 'true' ||
        steps.detect-changes.outputs.backend-src == 'true' }}
      # Meticulous only exercises frontend changes, so it gates on this alone.
      frontend-src: ${{ steps.detect-changes.outputs.frontend-src }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true # required to get more history in the changed-files action
          fetch-depth: 0
          filter: blob:none
      - name: Detect changes
        id: detect-changes
        uses: ./.github/actions/change-detection
        with:
          self: .github/workflows/pr-build-grafana.yml

  # Prod-like build: compile frontend + backend in parallel → assemble tarball
  # → build all 6 Docker variants. Mirrors the release-build.yml structure so
  # the same code paths are exercised on every PR.

  build-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.changed == 'true'
    name: build / frontend
    runs-on: ubuntu-x64-large
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Install JS dependencies
        uses: ./.github/actions/yarn-install
      - name: Build frontend
        run: npm run build
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: pr-frontend
          path: |
            public/
            !public/**/node_modules/
          retention-days: 1

  build-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.changed == 'true'
    name: build / backend (linux-amd64)
    runs-on: ubuntu-x64-large
    permissions:
      contents: read
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: build
        uses: ./.github/actions/build-go
        with:
          build-number: ${{ github.run_id }}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: pr-backend-linux-amd64
          path: bin/linux/amd64
          retention-days: 1

  build-source-targz:
    name: build / source tarball
    runs-on: ubuntu-x64-large
    needs:
      - build-frontend
      - build-backend
    permissions:
      contents: read
    outputs:
      version: ${{ needs.build-backend.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-targz
        with:
          build-number: ${{ github.run_id }}
          build-version: ${{ needs.build-backend.outputs.version }}
          frontend-artifact: pr-frontend
          backend-artifact: pr-backend-linux-amd64
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: pr-source-targz
          path: dist/*.tar.gz
          retention-days: 1

  build-docker-variants:
    name: build / variants (targz)
    needs: build-source-targz
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-docker-variants.yml
    with:
      targz-artifact-name: pr-source-targz
      name: linux-amd64
      os: linux
      arch: amd64
      arch-tag: amd64
      version: ${{ needs.build-source-targz.outputs.version }}
      build-number: ${{ github.run_id }}
      tag-prefix: 'grafana/grafana-image-tags:'

  run-meticulous-tests:
    name: Run Meticulous tests
    runs-on: ubuntu-x64
    needs:
      - detect-changes
      - build-docker-variants
    if: github.event_name == 'pull_request' &&
      github.repository == 'grafana/grafana' &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.base.ref == 'main' &&
      needs.detect-changes.outputs.frontend-src == 'true'
    continue-on-error: true
    permissions:
      actions: write
      contents: read
      id-token: write
      issues: write
      pull-requests: write
      statuses: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check whether Meticulous should run
        id: meticulous-eligibility
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            let run = true;
            if (context.payload.pull_request.user.login === 'renovate-sh-app[bot]') {
              // Renovate applies labels after opening the PR, so read the current labels.
              const { data: pullRequest } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: context.issue.number,
              });
              run = pullRequest.labels.some((label) => label.name === 'ci/meticulous');
            }
            core.setOutput('run', run);
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: steps.meticulous-eligibility.outputs.run == 'true'
        with:
          name: artifacts-docker-linux-amd64
          path: dist
      - name: Load Docker image for Meticulous
        id: load-image
        if: steps.meticulous-eligibility.outputs.run == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          for IMAGE_ARCHIVE in dist/*.docker.tar.gz; do break; done
          LOADED_IMAGE_NAME=$(docker load -i "$IMAGE_ARCHIVE" | sed -n 's/^Loaded image: //p')
          echo "image-tag=${LOADED_IMAGE_NAME}" >> "$GITHUB_OUTPUT"
      - name: Get vault secrets
        if: steps.meticulous-eligibility.outputs.run == 'true'
        id: vault-secrets
        continue-on-error: true
        uses: grafana/shared-workflows/actions/get-vault-secrets@main
        with:
          repo_secrets: |
            METICULOUS_API_TOKEN=meticulous-ui:api-token
      - name: Run Meticulous tests
        if: steps.meticulous-eligibility.outputs.run == 'true'
        continue-on-error: true
        uses: alwaysmeticulous/report-diffs-action/upload-container@739cb7bd62805f98f3c8749f8149ba4ecd86725d # v1
        with:
          api-token: ${{ fromJSON(steps.vault-secrets.outputs.secrets).METICULOUS_API_TOKEN }}
          image-tag: ${{ steps.load-image.outputs.image-tag }}
          container-port: 3000
          container-env: |
            GF_AUTH_ANONYMOUS_ENABLED=true
            GF_AUTH_ANONYMOUS_ORG_ROLE=Admin

  push-docker-image:
    needs: build-docker-variants
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    name: Push PR Docker image
    outputs:
      IMAGE: ${{ steps.push-image.outputs.IMAGE }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-x64
    steps:
      - uses: grafana/shared-workflows/actions/login-to-gar@main
        id: login-to-gar
        with:
          registry: 'us-docker.pkg.dev'
          environment: 'dev'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: artifacts-docker-linux-amd64
          path: .
      - name: Load & Push Docker image
        id: push-image
        env:
          BUILD_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for f in *.docker.tar.gz; do break; done
          LOADED_IMAGE_NAME=$(docker load -i "$f" | sed 's/Loaded image: //g')
          VERSION=$(echo "${LOADED_IMAGE_NAME}" | cut -d ':' -f 2 | cut -d '-' -f 1)
          DOCKER_IMAGE="us-docker.pkg.dev/grafanalabs-dev/docker-grafana-dev/grafana:${VERSION}-${BUILD_ID}"
          docker tag "${LOADED_IMAGE_NAME}" "${DOCKER_IMAGE}"
          docker push "${DOCKER_IMAGE}"
          echo "IMAGE=${DOCKER_IMAGE}" >> "$GITHUB_ENV"
          echo "IMAGE=${DOCKER_IMAGE}" | tee -a "$GITHUB_OUTPUT"
