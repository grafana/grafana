name: Bootstrap Go Build Cache

# Makes sure the Go build cache exists for one bucket, so that jobs which build
# the same tree restore the result instead of repeating it.
#
# The usual outcome is that the entry is already there, so the job only asks
# whether the key exists and stops, without downloading anything. On a miss it
# restores the modules the sibling workflow saved, compiles every non-test
# package and saves the result.
#
# It compiles against the local build cache rather than the S3 one: the remote
# cache replaces GOCACHE with its own store, which would leave nothing on disk
# in the layout the consuming jobs restore.

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner for the bucket being warmed.
        required: true
        type: string
      enterprise:
        description: Check out the enterprise tree, which changes the cache keys.
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  go-build-cache:
    name: Warm Go build cache
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          filter: blob:none

      - name: Get GitHub App token
        if: ${{ inputs.enterprise && github.event.pull_request.head.repo.fork == false }}
        id: get-github-app-token
        uses: grafana/shared-workflows/actions/create-github-app-token@259ba21cb3ff07724f331e26d926d655d24b317b # create-github-app-token/v0.2.3
        with:
          github_app: grafana-ci-bot

      - name: Setup Enterprise
        if: ${{ inputs.enterprise && github.event.pull_request.head.repo.fork == false }}
        uses: ./.github/actions/setup-enterprise
        with:
          token: ${{ steps.get-github-app-token.outputs.token }}

      # The key has to match the one setup-go computes, so it is derived the
      # same way: the pinned Go version and a hash of the module files, which
      # for an enterprise run includes the enterprise tree checked out above.
      - name: Compute the cache key
        id: key
        run: |
          set -euo pipefail
          GO_VERSION="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          echo "key=gobuild-${RUNNER_OS}-${RUNNER_ARCH}-${GO_VERSION}-${{ hashFiles('**/*.mod', '**/*.sum') }}" >> "$GITHUB_OUTPUT"

      - name: Is the cache already populated?
        id: probe
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Setup Go
        if: steps.probe.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-go
        with:
          build-cache: 'false'

      - name: Build all packages
        if: steps.probe.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          for dir in $(go list -m -f '{{.Dir}}'); do
            (cd "$dir" && go build ./...)
          done

      - name: Save the build cache
        if: steps.probe.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/go-build
          key: ${{ steps.key.outputs.key }}
