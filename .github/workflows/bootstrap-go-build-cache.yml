name: Bootstrap Go Build Cache

# Makes sure the Go build cache exists, so that jobs which build the same tree
# restore the result instead of repeating it.
#
# Asking whether the key exists costs one API call, so that question is its own
# job on a small runner and the compile only claims a full one on a miss. The
# usual outcome is a hit, and then nothing is downloaded or built.
#
# One entry serves both OSS and enterprise jobs. The enterprise tree adds
# packages but no module files, so the key is the same either way, and the
# entry is only a superset if it holds both tag variants. A run that can reach
# the enterprise tree therefore compiles untagged and tagged; a fork, which
# cannot, compiles untagged and leaves the tagged half to the base branch.
# Build tags and CGO_ENABLED both feed the cache key Go computes, so these have
# to match what the consuming jobs pass or nothing they ask for is present.
#
# It compiles against the local build cache rather than the S3 one: the remote
# cache replaces GOCACHE with its own store, which would leave nothing on disk
# in the layout the consuming jobs restore.

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner for the compile, which only happens on a miss.
        required: true
        type: string
      probe-runner:
        description: Runner for the key lookup. Must match the arch of runs-on.
        required: false
        default: ubuntu-x64-small
        type: string
      enterprise:
        description: Also compile the enterprise tree, so the entry is a superset.
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  probe:
    name: Warm Go build cache
    runs-on: ${{ inputs.probe-runner }}
    permissions:
      contents: read
    outputs:
      hit: ${{ steps.probe.outputs.cache-hit }}
      key: ${{ steps.key.outputs.key }}
      prefix: ${{ steps.key.outputs.prefix }}
    steps:
      # The key is derived from the module files and nothing else, so only
      # those are checked out.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            **/*.mod
            **/*.sum
          sparse-checkout-cone-mode: false

      # The key has to match the one setup-go computes, so it is derived the
      # same way: the pinned Go version and a hash of the module files.
      - name: Compute the cache key
        id: key
        run: |
          set -euo pipefail
          GO_VERSION="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          {
            echo "key=gobuild-${RUNNER_OS}-${RUNNER_ARCH}-${GO_VERSION}-${{ hashFiles('**/*.mod', '**/*.sum') }}"
            echo "prefix=gobuild-${RUNNER_OS}-${RUNNER_ARCH}-${GO_VERSION}-"
          } >> "$GITHUB_OUTPUT"

      - name: Is the cache already populated?
        id: probe
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      # A miss is slow rather than wrong, so it is reported without failing the
      # run, which would block every workflow waiting on this one.
      - name: Report a miss
        if: steps.probe.outputs.cache-hit != 'true'
        env:
          KEY: ${{ steps.key.outputs.key }}
        run: echo "::warning title=Go build cache miss::${KEY} is not cached, rebuilding it"

  populate:
    name: Populate Go build cache
    needs: probe
    if: needs.probe.outputs.hit != 'true'
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          filter: blob:none

      # The tagged half of the entry is an optimisation, so a run that cannot
      # reach the enterprise tree saves the untagged half rather than failing
      # and leaving every dependent workflow with no cache at all.
      - name: Get GitHub App token
        if: ${{ inputs.enterprise && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
        id: get-github-app-token
        continue-on-error: true
        uses: grafana/shared-workflows/actions/create-github-app-token@259ba21cb3ff07724f331e26d926d655d24b317b # create-github-app-token/v0.2.3
        with:
          github_app: grafana-ci-bot

      - name: Setup Enterprise
        id: setup-enterprise
        if: steps.get-github-app-token.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/setup-enterprise
        with:
          token: ${{ steps.get-github-app-token.outputs.token }}

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          cache-write: 'build'

      # Nothing under scripts is compiled by the jobs this cache serves, so
      # warming it buys nothing and one of them does not build at all.
      - name: Build all packages
        env:
          CGO_ENABLED: '0'
          ENTERPRISE: ${{ steps.setup-enterprise.outcome == 'success' }}
        run: |
          set -euo pipefail
          TAGSETS=("")
          if [ "$ENTERPRISE" = "true" ]; then
            TAGSETS+=("enterprise")
          fi
          for tags in "${TAGSETS[@]}"; do
            for dir in $(go list -m -f '{{.Dir}}'); do
              (
                cd "$dir"
                PACKAGES="$(go list -tags="$tags" ./... | grep -v '/scripts/' || true)"
                if [ -n "$PACKAGES" ]; then
                  echo "$PACKAGES" | xargs go build -tags="$tags"
                fi
              )
            done
          done
