name: Bootstrap Go Module Cache

# Makes sure the Go module cache exists for one bucket. The cache keys carry the
# runner arch and a hash of the module files, so an OSS job and an enterprise
# job never share an entry and each needs its own run of this.
#
# The usual outcome is that the entry is already there, so the job only asks
# whether the key exists and stops. Nothing is downloaded on that path: the
# point is to hold the dependent workflows until the cache is known to be
# populated, not to populate this runner.
#
# On a miss it downloads the modules and saves them. Modules come from the S3
# proxy where the grafana-cicd role is available, which is shared across
# branches and so still serves a pull request whose module files are new to the
# GitHub cache. Only this workflow needs the role; the entry it saves is what
# everything else restores.

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner for the bucket being warmed.
        required: true
        type: string
      enterprise:
        description: Check out the enterprise tree, which changes the cache keys.
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  go-mod-cache:
    name: Warm Go module cache
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          filter: blob:none

      - name: Get GitHub App token
        if: ${{ inputs.enterprise && github.event.pull_request.head.repo.fork == false }}
        id: get-github-app-token
        uses: grafana/shared-workflows/actions/create-github-app-token@259ba21cb3ff07724f331e26d926d655d24b317b # create-github-app-token/v0.2.3
        with:
          github_app: grafana-ci-bot

      - name: Setup Enterprise
        if: ${{ inputs.enterprise && github.event.pull_request.head.repo.fork == false }}
        uses: ./.github/actions/setup-enterprise
        with:
          token: ${{ steps.get-github-app-token.outputs.token }}

      # The key has to match the one setup-go computes, so it is derived the
      # same way: the pinned Go version and a hash of the module files, which
      # for an enterprise run includes the enterprise tree checked out above.
      - name: Compute the cache key
        id: key
        run: |
          set -euo pipefail
          GO_VERSION="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          echo "key=gomod-${RUNNER_OS}-${RUNNER_ARCH}-${GO_VERSION}-${{ hashFiles('**/*.mod', '**/*.sum') }}" >> "$GITHUB_OUTPUT"

      - name: Is the cache already populated?
        id: probe
        uses: actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Setup Go
        if: steps.probe.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-go
        with:
          cache: 'false'

      - name: Use the S3 module proxy
        id: s3-proxy
        if: ${{ steps.probe.outputs.cache-hit != 'true' && github.event.pull_request.head.repo.fork == false }}
        continue-on-error: true
        uses: ./.github/actions/setup-go-remote-cache

      # The proxy is an optimisation, so a job that cannot reach it downloads
      # from the public proxy instead of failing. Clear the settings rather than
      # leave them pointing at a server that never started.
      - name: Fall back to the public proxy
        if: ${{ steps.s3-proxy.outcome == 'failure' }}
        run: |
          set -euo pipefail
          {
            echo "GOPROXY="
            echo "GOSUMDB="
            echo "GOCACHEPROG="
          } >> "$GITHUB_ENV"

      - name: Download modules
        if: steps.probe.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          for dir in $(go list -m -f '{{.Dir}}'); do
            (cd "$dir" && go mod download all)
          done

      - name: Save the module cache
        if: steps.probe.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.key.outputs.key }}
