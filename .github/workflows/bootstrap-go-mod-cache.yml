name: Bootstrap Go Module Cache

# Makes sure the Go module cache exists. The enterprise tree adds packages but
# no module files, so its module set is the one described by the modules here
# and a single entry serves both.
#
# Asking whether the key exists costs one API call, so that question is its own
# job on a small runner and the download only claims a full one on a miss. The
# usual outcome is a hit, and then nothing is downloaded: the point is to hold
# the dependent workflows until the cache is known to be populated, not to
# populate this runner.
#
# Modules come from the S3 proxy where the grafana-cicd role is available,
# which is shared across branches and so still serves a pull request whose
# module files are new to the GitHub cache. Only this workflow needs the role;
# the entry it saves is what everything else restores.

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner for the download, which only happens on a miss.
        required: true
        type: string
      probe-runner:
        description: Runner for the key lookup. Must match the arch of runs-on.
        required: false
        default: ubuntu-x64-small
        type: string

permissions: {}

jobs:
  probe:
    name: Warm Go module cache
    runs-on: ${{ inputs.probe-runner }}
    permissions:
      contents: read
    outputs:
      hit: ${{ steps.probe.outputs.cache-hit }}
      key: ${{ steps.key.outputs.key }}
      prefix: ${{ steps.key.outputs.prefix }}
    steps:
      # The key is derived from the module files and nothing else, so only
      # those are checked out.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            **/*.mod
            **/*.sum
          sparse-checkout-cone-mode: false

      # The key has to match the one setup-go computes, so it is derived the
      # same way: the pinned Go version and a hash of the module files.
      - name: Compute the cache key
        id: key
        run: |
          set -euo pipefail
          GO_VERSION="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          {
            echo "key=gomod-${RUNNER_OS}-${RUNNER_ARCH}-${GO_VERSION}-${{ hashFiles('**/*.mod', '**/*.sum') }}"
            echo "prefix=gomod-${RUNNER_OS}-${RUNNER_ARCH}-${GO_VERSION}-"
          } >> "$GITHUB_OUTPUT"

      - name: Is the cache already populated?
        id: probe
        uses: actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      # A miss is slow rather than wrong, so it is reported without failing the
      # run, which would block every workflow waiting on this one.
      - name: Report a miss
        if: steps.probe.outputs.cache-hit != 'true'
        env:
          KEY: ${{ steps.key.outputs.key }}
        run: echo "::warning title=Go module cache miss::${KEY} is not cached, downloading it"

  populate:
    name: Populate Go module cache
    needs: probe
    if: needs.probe.outputs.hit != 'true'
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          filter: blob:none

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          build-cache: 'false'
          cache-write: 'mod'

      - name: Use the S3 module proxy
        id: s3-proxy
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        continue-on-error: true
        uses: ./.github/actions/setup-go-remote-cache

      # The proxy is an optimisation, so a job that cannot reach it downloads
      # from the public proxy instead of failing. Clear the settings rather than
      # leave them pointing at a server that never started.
      - name: Fall back to the public proxy
        if: ${{ steps.s3-proxy.outcome == 'failure' }}
        run: |
          set -euo pipefail
          {
            echo "GOPROXY="
            echo "GOSUMDB="
            echo "GOCACHEPROG="
          } >> "$GITHUB_ENV"

      - name: Download modules
        run: |
          set -euo pipefail
          for dir in $(go list -m -f '{{.Dir}}'); do
            (cd "$dir" && go mod download all)
          done
