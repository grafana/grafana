name: Meticulous fork PRs

on:
  workflow_dispatch:
    inputs:
      build-run-id:
        description: 'Completed PR build Docker image run ID for the fork PR'
        required: true
        type: string

permissions: {}

jobs:
  run-meticulous-tests:
    if: github.repository == 'grafana/grafana' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-x64
    continue-on-error: true
    permissions:
      actions: write
      contents: read
      id-token: write
      issues: write
      pull-requests: write
      statuses: read
    steps:
      - name: Validate completed fork build
        id: eligibility
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          BUILD_RUN_ID: ${{ inputs.build-run-id }}
        with:
          script: |
            const runId = process.env.BUILD_RUN_ID;
            if (!/^[1-9][0-9]*$/.test(runId) || !Number.isSafeInteger(Number(runId))) {
              throw new Error('Build run ID must be a positive integer.');
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: Number(runId),
            });
            const { data: workflow } = await github.rest.actions.getWorkflow({
              ...context.repo, workflow_id: 'pr-build-grafana.yml',
            });
            if (run.workflow_id !== workflow.id || run.event !== 'pull_request' ||
                run.status !== 'completed' || run.conclusion !== 'success') {
              throw new Error('Select a successful, completed PR build Docker image run.');
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: run.id, filter: 'latest',
            });
            if (!jobs.some(job => job.name === 'Meticulous fork eligibility' && job.conclusion === 'success')) {
              throw new Error('Build is not eligible for fork frontend testing.');
            }
            // Resolve the current PR through the API rather than trusting dispatch inputs.
            const pulls = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              ...context.repo, commit_sha: run.head_sha,
            });
            const pr = pulls.find(pr => pr.state === 'open' && !pr.draft &&
              pr.base.repo.full_name === context.payload.repository.full_name && pr.base.ref === 'main' &&
              pr.head.repo?.fork && pr.head.repo.full_name === run.head_repository.full_name &&
              pr.head.sha === run.head_sha);
            if (!pr) throw new Error('No current, open, non-draft fork PR targeting main matches this build.');
            if (pr.user.login === 'renovate-sh-app[bot]' && !pr.labels.some(label => label.name === 'ci/meticulous')) return;
            // Supply PR context so Meticulous resolves the PR base rather than the dispatch branch.
            // Only API-derived metadata is passed; no fork files are executed.
            const fs = require('fs');
            const path = require('path').join(process.env.RUNNER_TEMP, 'meticulous-pull-request.json');
            fs.writeFileSync(path, JSON.stringify({
              pull_request: pr, number: pr.number, repository: context.payload.repository,
            }));
            core.setOutput('event-path', path);
            core.setOutput('sha', pr.head.sha);
            core.setOutput('run-id', run.id);
            core.setOutput('run', 'true');
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: steps.eligibility.outputs.run == 'true'
        with:
          name: artifacts-docker-linux-amd64
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ steps.eligibility.outputs.run-id }}
      - name: Load Docker image
        if: steps.eligibility.outputs.run == 'true'
        id: image
        shell: bash
        run: |
          set -euo pipefail
          for archive in dist/*.docker.tar.gz; do break; done
          image=$(docker load -i "$archive" | sed -n 's/^Loaded image: //p')
          [[ -n "$image" && "$image" != *$'\n'* ]]
          docker tag "$image" meticulous-fork:upload
          echo 'tag=meticulous-fork:upload' >> "$GITHUB_OUTPUT"
      - name: Get vault secrets
        if: steps.eligibility.outputs.run == 'true'
        id: vault-secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@6a943082408bb241a26b14661e446220c3e62b16
        with:
          repo_secrets: |
            METICULOUS_API_TOKEN=meticulous-ui:api-token
      - name: Run Meticulous tests
        if: steps.eligibility.outputs.run == 'true'
        uses: alwaysmeticulous/report-diffs-action/upload-container@739cb7bd62805f98f3c8749f8149ba4ecd86725d # v1
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_EVENT_PATH: ${{ steps.eligibility.outputs.event-path }}
        with:
          api-token: ${{ fromJSON(steps.vault-secrets.outputs.secrets).METICULOUS_API_TOKEN }}
          commit-sha: ${{ steps.eligibility.outputs.sha }}
          image-tag: ${{ steps.image.outputs.tag }}
          container-port: 3000
          container-env: |
            GF_AUTH_ANONYMOUS_ENABLED=true
            GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
