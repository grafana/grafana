# Fails a PR when generated protobuf Go code doesn't match its .proto files.
name: Protobuf generated code

on:
  pull_request:
    paths:
      - 'pkg/storage/unified/proto/**'
      - 'pkg/storage/unified/resourcepb/**'
      - '.github/workflows/proto-codegen-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  generated:
    name: ${{ matrix.module }}
    runs-on: ubuntu-arm64-small
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module:
          # To check another buf module, add its path here and its proto and
          # generated code directories to the `paths:` filter above.
          - pkg/storage/unified/proto
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          cache-build: 'false'

      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: 1.65.0
          setup_only: true

      # Versions must match the `protobuf` target in the Makefile, otherwise the output differs.
      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.4.0

      - name: Generate
        env:
          MODULE: ${{ matrix.module }}
        run: buf generate "$MODULE" --template "$MODULE/buf.gen.yaml"

      - name: Check for differences
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git diff
            echo "Generated protobuf code is out of date. Run 'make protobuf' and commit the changes."
            exit 1
          fi
