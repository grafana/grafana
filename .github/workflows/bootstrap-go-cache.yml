name: Bootstrap Go Cache

on:
  workflow_call:

permissions: {}

jobs:
  populate:
    name: Populate Go cache
    runs-on: ubuntu-x64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          filter: blob:none

      - name: Get GitHub App token
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        id: get-github-app-token
        uses: grafana/shared-workflows/actions/create-github-app-token@259ba21cb3ff07724f331e26d926d655d24b317b # create-github-app-token/v0.2.3
        with:
          github_app: grafana-ci-bot

      - name: Setup Enterprise
        if: steps.get-github-app-token.outcome == 'success'
        id: setup-enterprise
        uses: ./.github/actions/setup-enterprise
        with:
          token: ${{ steps.get-github-app-token.outputs.token }}

      - name: Setup Go
        id: setup-go
        uses: ./.github/actions/setup-go
        with:
          cache-write: 'true'

      - name: Download modules and compile packages
        if: steps.setup-go.outputs.cache-hit != 'true'
        env:
          ENTERPRISE: ${{ steps.setup-enterprise.outcome == 'success' }}
        run: |
          set -euo pipefail
          readarray -t modules <<< "$(go list -m -f '{{.Dir}}')"

          for module in "${modules[@]}"; do
            (cd "$module" && go mod download all)
          done
          go install github.com/jstemmer/go-junit-report/v2@85bf4716ac1f025f2925510a9f5e9f5bb347c009

          tagsets=("")
          if [ "$ENTERPRISE" = "true" ]; then
            tagsets+=(enterprise)
          fi

          for cgo in 0 1; do
            for tags in "${tagsets[@]}"; do
              for module in "${modules[@]}"; do
                package_file="$(mktemp)"
                (cd "$module" && go list -f '{{.ImportPath}}' ./...) > "$package_file"
                readarray -t packages < "$package_file"
                rm "$package_file"
                if [ "${#packages[@]}" -gt 0 ]; then
                  CGO_ENABLED="$cgo" go test -run '^$' -vet=off -tags="$tags" "${packages[@]}"
                fi
              done
            done
          done
