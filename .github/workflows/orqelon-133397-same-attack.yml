name: ORQELON Grafana 133397 Same-Attack

on:
  push:
    branches:
      - fix/133397-legacy-traces-to-logs-custom-query
  workflow_dispatch:

permissions:
  contents: read

jobs:
  same-attack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: yarn install --immutable
      - name: Run preserved First-Red file unchanged
        run: yarn jest packages/grafana-o11y-ds-frontend/src/TraceToLogs/TraceToLogsSettings.test.tsx --runInBand
