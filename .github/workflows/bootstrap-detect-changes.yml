name: Bootstrap Detect Changes

on:
  workflow_call:
    inputs:
      self:
        description: Path to the calling workflow, treated as any change category.
        required: true
        type: string
    outputs:
      self:
        value: ${{ jobs.detect-changes.outputs.self }}
      backend:
        value: ${{ jobs.detect-changes.outputs.backend }}
      backend-src:
        value: ${{ jobs.detect-changes.outputs.backend-src }}
      frontend:
        value: ${{ jobs.detect-changes.outputs.frontend }}
      frontend-src:
        value: ${{ jobs.detect-changes.outputs.frontend-src }}
      frontend-dependencies:
        value: ${{ jobs.detect-changes.outputs.frontend-dependencies }}
      frontend-packages:
        value: ${{ jobs.detect-changes.outputs.frontend-packages }}
      e2e:
        value: ${{ jobs.detect-changes.outputs.e2e }}
      e2e-cloud-plugins:
        value: ${{ jobs.detect-changes.outputs.e2e-cloud-plugins }}
      dev-tooling:
        value: ${{ jobs.detect-changes.outputs.dev-tooling }}
      docs:
        value: ${{ jobs.detect-changes.outputs.docs }}
      dockerfile:
        value: ${{ jobs.detect-changes.outputs.dockerfile }}
      docker-build:
        value: ${{ jobs.detect-changes.outputs.docker-build }}
      makefile:
        value: ${{ jobs.detect-changes.outputs.makefile }}
      rpm-packaging:
        value: ${{ jobs.detect-changes.outputs.rpm-packaging }}
      devenv:
        value: ${{ jobs.detect-changes.outputs.devenv }}

permissions: {}

jobs:
  detect-changes:
    name: Detect changed files
    runs-on: ubuntu-arm64-small
    permissions:
      contents: read
    outputs:
      self: ${{ steps.detect-changes.outputs.self }}
      backend: ${{ steps.detect-changes.outputs.backend }}
      backend-src: ${{ steps.detect-changes.outputs.backend-src }}
      frontend: ${{ steps.detect-changes.outputs.frontend }}
      frontend-src: ${{ steps.detect-changes.outputs.frontend-src }}
      frontend-dependencies: ${{ steps.detect-changes.outputs.frontend-dependencies }}
      frontend-packages: ${{ steps.detect-changes.outputs.frontend-packages }}
      e2e: ${{ steps.detect-changes.outputs.e2e }}
      e2e-cloud-plugins: ${{ steps.detect-changes.outputs.e2e-cloud-plugins }}
      dev-tooling: ${{ steps.detect-changes.outputs.dev-tooling }}
      docs: ${{ steps.detect-changes.outputs.docs }}
      dockerfile: ${{ steps.detect-changes.outputs.dockerfile }}
      docker-build: ${{ steps.detect-changes.outputs.docker-build }}
      makefile: ${{ steps.detect-changes.outputs.makefile }}
      rpm-packaging: ${{ steps.detect-changes.outputs.rpm-packaging }}
      devenv: ${{ steps.detect-changes.outputs.devenv }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true # required to get more history in the changed-files action
          fetch-depth: 0
          filter: blob:none
      - name: Detect changes
        id: detect-changes
        uses: ./.github/actions/change-detection
        with:
          self: ${{ inputs.self }}

  # The cache keys carry the runner arch and a hash of the module files, so an
  # arm64 job and an x64 job, or an OSS job and an enterprise job, never share
  # an entry. Each combination needs its own writer.
