name: Bootstrap Yarn Cache

# Every other job restores the yarn download cache; only this workflow saves
# it. The ref decides which tree's lock file is hashed, so a caller that needs
# the base branch entry as well asks for it by ref.

on:
  workflow_call:
    inputs:
      ref:
        description: Tree whose lock file is cached. Defaults to the running ref.
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  probe:
    name: Warm yarn cache
    runs-on: ubuntu-arm64-small
    permissions:
      contents: read
    outputs:
      hit: ${{ steps.probe.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          sparse-checkout: |
            yarn.lock
            .yarnrc.yml
          sparse-checkout-cone-mode: false

      - name: Resolve the cache folder
        id: folder
        run: echo "path=${HOME}/.cache/yarn" >> "$GITHUB_OUTPUT"

      - name: Is the cache already populated?
        id: probe
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.folder.outputs.path }}
          key: yarn-download-cache-default-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
          lookup-only: true

      - name: Report a miss
        if: steps.probe.outputs.cache-hit != 'true'
        env:
          KEY: yarn-download-cache-default-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
        run: echo "::warning title=Yarn cache miss::${KEY} is not cached, installing it"

  populate:
    name: Populate yarn cache
    needs: probe
    if: needs.probe.outputs.hit != 'true'
    runs-on: ubuntu-x64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-node
      - name: Install JS dependencies
        uses: ./.github/actions/yarn-install
        with:
          cache-write: 'true'
