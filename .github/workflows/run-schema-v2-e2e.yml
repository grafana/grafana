name: Run dashboard schema v2 e2e

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  dashboard-schema-v2-e2e:
    runs-on: ubuntu-x64-large
    continue-on-error: true
    # Run on `grafana/grafana` pushes (not mirrors), or on non-draft pull requests
    if: (github.event_name == 'push' && github.repository == 'grafana/grafana') || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Go
        uses: ./.github/actions/setup-go
      - run: go version
      - name: Setup Node
        uses: ./.github/actions/setup-node
      - name: Install frontend dependencies
        uses: ./.github/actions/yarn-install
      - name: Install Playwright browsers
        uses: ./.github/actions/setup-playwright
      - name: Build Grafana backend
        run: make build-go
      - name: Build Grafana frontend
        uses: ./.github/actions/build-frontend
        with:
          sourcemaps: 'false'
      - name: Setup Grafana for E2E tests
        uses: ./.github/actions/setup-grafana-e2e
        with:
          built-backend-dir: bin
          built-frontend-dir: dist/frontend
      - name: Run dashboard scenes e2e
        env:
          GRAFANA_URL: http://localhost:3001
          KUBERNETES_DASHBOARDS: 'true'
        run: pnpm run e2e:playwright --project=dashboards || echo "Test failed but marking as success since schema V2 is behind a feature flag and should not block PRs"
      - name: Always succeed # This is a workaround to make the job pass even if the previous step fails
        if: failure()
        run: exit 0
