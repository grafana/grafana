name: Nix build Grafana
run-name: Nix backend test benchmark

on:
  push:
    branches:
      - macabu/nix-test-benchmark

permissions:
  contents: read
  actions: read

env:
  CGO_ENABLED: '0'

jobs:
  native:
    name: Native ${{ matrix.suite }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            runner: ubuntu-x64
          - suite: mysql
            runner: ubuntu-x64-large-io
          - suite: postgres
            runner: ubuntu-x64-large-io
    steps:
      - &checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - &setup-go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore native Go cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: nix-bench-v3-native-${{ matrix.suite }}-${{ hashFiles('**/*.mod') }}
      - name: Run native tests
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          if [[ "$SUITE" == unit ]]; then
            bash .github/nix-test-benchmark.sh unit "$RUNNER_TEMP/summary.json"
          else
            bash .github/nix-test-benchmark.sh "$SUITE" native-sql "$RUNNER_TEMP/summary.json"
          fi
          cat "$RUNNER_TEMP/summary.json" >> "$GITHUB_STEP_SUMMARY"

  nix-unit:
    name: Nix unit
    runs-on: ubuntu-x64
    env:
      SUITE: unit
    steps:
      - *checkout
      - &install-nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: '2.35.4'
          trust-runner-user: 'true'
          extra-conf: |
            sandbox = true
            sandbox-fallback = false
      - &hestia
        uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
        with:
          version: v3.1.0
          upstream-cache-filter: 'true'
      - &substitute
        name: Check for cached Nix output
        id: cached
        run: |
          if path=$(nix build --no-link --print-out-paths --max-jobs 0 --option builders '' \
              --file .github/nix-test-benchmark.nix "$SUITE" 2>"$RUNNER_TEMP/nix-cache-check.log"); then
            printf 'path=%s\n' "$path" >> "$GITHUB_OUTPUT"
            echo "Nix output cache hit"
          else
            echo "Nix output cache miss"
          fi
      - &restore-nix-go
        name: Restore Nix Go compiler cache
        if: steps.cached.outputs.path == ''
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/grafana-bench-go-cache
          key: nix-bench-v3-go-${{ env.SUITE }}-${{ hashFiles('flake.lock', '**/*.mod') }}
      - &build-nix-tests
        name: Build Nix test derivation
        id: built
        if: steps.cached.outputs.path == ''
        run: |
          cache="$RUNNER_TEMP/grafana-bench-go-cache"
          mkdir -p "$cache"
          sudo chgrp -R nixbld "$cache"
          sudo chmod -R g+rwX "$cache"
          path=$(nix build -L --no-link --print-out-paths \
            --option extra-sandbox-paths "/grafana-go-cache=$cache" \
            --file .github/nix-test-benchmark.nix "$SUITE")
          printf 'path=%s\n' "$path" >> "$GITHUB_OUTPUT"
      - name: Report Nix unit coverage
        env:
          OUTPUT: ${{ steps.cached.outputs.path || steps.built.outputs.path }}
        run: cat "$OUTPUT/summary.json" | tee -a "$GITHUB_STEP_SUMMARY"

  nix-sql-build:
    name: Nix compile SQL tests
    runs-on: ubuntu-x64-large-io
    env:
      SUITE: sql
    outputs:
      path: ${{ steps.cached.outputs.path || steps.built.outputs.path }}
    steps:
      - *checkout
      - *install-nix
      - *hestia
      - *substitute
      - *restore-nix-go
      - *build-nix-tests

  nix-sql:
    name: Nix ${{ matrix.db }}
    needs: nix-sql-build
    runs-on: ubuntu-x64-large-io
    strategy:
      fail-fast: false
      matrix:
        db: [mysql, postgres]
    steps:
      - *checkout
      - *setup-go
      - *install-nix
      - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
        with:
          version: v3.1.0
          read-only: 'true'
          upstream-cache-filter: 'true'
      - name: Fetch compiled SQL tests
        env:
          TEST_BINARIES: ${{ needs.nix-sql-build.outputs.path }}
        run: nix build --no-link --max-jobs 0 --option builders '' "$TEST_BINARIES"
      - name: Run compiled SQL tests
        env:
          DB: ${{ matrix.db }}
          TEST_BINARIES: ${{ needs.nix-sql-build.outputs.path }}
        run: |
          bash .github/nix-test-benchmark.sh "$DB" compiled-sql "$TEST_BINARIES" "$RUNNER_TEMP/summary.json"
          cat "$RUNNER_TEMP/summary.json" >> "$GITHUB_STEP_SUMMARY"
