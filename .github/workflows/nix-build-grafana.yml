name: Nix build Grafana

on:
  push:
    paths:
      - .github/workflows/nix-build-grafana.yml
      - flake.nix
      - flake.lock
      - 'nix/**'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read # Lets Hestia detect evicted cache entries before substituting them.

jobs:
  eval:
    name: Evaluate Nix build matrix
    runs-on: ubuntu-x64-large
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any-jobs: ${{ steps.matrix.outputs.any-jobs }}
      manifest-version: ${{ steps.matrix.outputs.manifest-version }}
      tarballs: ${{ steps.tarballs.outputs.targets }}
      go-toolchain: ${{ steps.go.outputs.toolchain }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: '2.35.4'
          # Hestia configures a local substituter and a post-build hook.
          trust-runner-user: 'true'
          extra-conf: |
            sandbox = true
            sandbox-fallback = false
      - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
        with:
          version: v3.1.0
          upstream-cache-filter: 'true'
          filter-drv-closures: 'true'
      - name: Cache shared build inputs
        id: go
        run: |
          nix build -L --no-link .#ciPackages.backend.goModules
          toolchain=$(nix eval --raw .#ciPackages.backend.go.outPath)
          printf 'toolchain=%s\n' "${toolchain##*/}" >> "$GITHUB_OUTPUT"
      - id: matrix
        uses: Mic92/hestia/matrix@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
        with:
          flake: .#ciJobs
          nix-eval-jobs: nix run --inputs-from . nixpkgs#nix-eval-jobs --
      - name: List tarball packages
        id: tarballs
        run: |
          targets=$(nix eval --json .#ciPackages --apply '
            packages: builtins.filter (name: builtins.match "tarball-.+" name != null)
              (builtins.attrNames packages)
          ')
          printf 'targets=%s\n' "$targets" >> "$GITHUB_OUTPUT"

  build:
    needs: eval
    if: needs.eval.outputs.any-jobs == 'true'
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-x64-large
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.eval.outputs.matrix) }}
    steps:
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: '2.35.4'
          trust-runner-user: 'true'
          extra-conf: |
            sandbox = true
            sandbox-fallback = false
      - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
        with:
          version: v3.1.0
          upstream-cache-filter: 'true'
          wait-manifest-version: ${{ needs.eval.outputs.manifest-version }}
      - name: Restore Go compiler cache
        if: matrix.name == 'backend-linux-amd64'
        id: go-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/grafana-go-cache
          key: nix-gocache-v1-linux-amd64-${{ needs.eval.outputs.go-toolchain }}
      - name: Build from cached derivation
        env:
          INSTALLABLES: ${{ matrix.installables }}
          PACKAGE_NAME: ${{ matrix.name }}
        run: |
          read -r -a installables <<< "$INSTALLABLES"
          "$HESTIA_BIN" prefetch "${installables[@]}"
          sandbox_options=()
          if [[ "$PACKAGE_NAME" == backend-linux-amd64 ]]; then
            cache="$RUNNER_TEMP/grafana-go-cache"
            mkdir -p "$cache"
            sudo chgrp -R nixbld "$cache"
            sudo chmod -R g+rwX "$cache"
            sandbox_options+=(--option extra-sandbox-paths "/grafana-go-cache=$cache")
          fi
          time nix build -L --no-link "${sandbox_options[@]}" "${installables[@]}"
      - name: Verify warm Go cache rebuild
        # Check each new cache scope once and allow a job rerun to benchmark a restore.
        if: matrix.name == 'backend-linux-amd64' && (steps.go-cache.outputs.cache-hit != 'true' || github.run_attempt != '1')
        env:
          INSTALLABLES: ${{ matrix.installables }}
        run: |
          read -r -a installables <<< "$INSTALLABLES"
          cache="$RUNNER_TEMP/grafana-go-cache"
          test -n "$(find "$cache" -type f -name '*-d' -print -quit)"
          sudo chmod -R g+rwX "$cache"
          time nix build -L --no-link --rebuild \
            --option extra-sandbox-paths "/grafana-go-cache=$cache" "${installables[@]}"

  package:
    needs: [eval, build]
    # Publish tarballs even when Hestia skips every component build.
    if: >-
      !cancelled() && needs.eval.result == 'success' &&
      (needs.build.result == 'success' ||
      (needs.build.result == 'skipped' && needs.eval.outputs.any-jobs == 'false'))
    name: Package ${{ matrix.tarball }}
    runs-on: ubuntu-x64-large
    strategy:
      fail-fast: false
      matrix:
        tarball: ${{ fromJSON(needs.eval.outputs.tarballs) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: '2.35.4'
          trust-runner-user: 'true'
          extra-conf: |
            sandbox = true
            sandbox-fallback = false
      - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
        with:
          version: v3.1.0
          upstream-cache-filter: 'true'
          wait-manifest-version: ${{ needs.eval.outputs.manifest-version }}
          # Keep the cache available for component outputs. Archives go to the artifact store.
          read-only: 'true'
      - name: Build release tarball
        env:
          TARBALL: ${{ matrix.tarball }}
        run: nix build -L ".#ciPackages.$TARBALL"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: grafana-nix-${{ matrix.tarball }}
          path: result/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
