name: Nix build Grafana

on:
  push:
    paths:
      - .github/workflows/nix-build-grafana.yml
      - flake.nix
      - flake.lock
      - 'nix/**'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read # Lets Hestia detect evicted cache entries before substituting them.

jobs:
  build:
    name: Build Linux AMD64 tarball
    runs-on: ubuntu-x64-large
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: '2.35.4'
          # The Nix daemon requires a trusted user to accept Hestia's substituter and build hook.
          trust-runner-user: 'true'
          extra-conf: |
            sandbox = true
            sandbox-fallback = false
      - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
        with:
          version: v3.1.0
          upstream-cache-filter: 'true'
      - name: Build Grafana
        run: nix build -L .#tarball-linux-amd64
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: grafana-nix-linux-amd64
          path: result/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
