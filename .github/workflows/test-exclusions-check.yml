name: Test exclusions check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/test-exclusions.json
      - scripts/ci/test-exclusions.sh
      - scripts/ci/validate-test-exclusions.sh
      - .github/workflows/test-exclusions-check.yml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate test exclusions
    runs-on: ubuntu-x64-small
    permissions:
      contents: read # to check out the code
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Validate .github/test-exclusions.json
        run: ./scripts/ci/validate-test-exclusions.sh
