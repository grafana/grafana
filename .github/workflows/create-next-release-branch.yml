name: Create next release branch
on:
  workflow_call:
    inputs:
      ownerRepo:
        type: string
        description: Owner/repo of the repository where the branch is created (e.g. 'grafana/grafana')
        required: true
      source:
        description: The release branch to increment (eg providing `release-11.2.3` will result in `release-11.2.4` being created)
        type: string
        required: true
      allow_existing:
        description: Succeed and return the next branch when it already exists
        type: boolean
        default: false
    outputs:
      branch:
        description: The new or already existing branch
        value: ${{ jobs.main.outputs.branch }}
  workflow_dispatch:
    inputs:
      ownerRepo:
        description: Owner/repo of the repository where the branch is created (e.g. 'grafana/grafana')
      source:
        description: The release branch to increment (eg providing `release-11.2.3` will result in `release-11.2.4` being created)
        type: string
        required: true
      allow_existing:
        description: Succeed and return the next branch when it already exists
        type: boolean
        default: false

permissions: {}

jobs:
  main:
    runs-on: ubuntu-arm64-small
    permissions:
      contents: read
      id-token: write
    outputs:
      branch: ${{ steps.existing.outputs.branch || steps.branch.outputs.branch }}
    steps:
      # The right app + permission-set depends on which repo we're creating the branch in.
      # Each (app, repo) pair has a dedicated writer-<scope>-<tier> permission-set in the
      # Post-release config entry, because Vault asks GitHub for a token covering every
      # repo in the permission-set's repositories list and no single app is installed on
      # all the target repos.
      - name: Compute app and permission_set
        id: app-config
        env:
          OWNER_REPO: ${{ inputs.ownerRepo }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$OWNER_REPO" in
            grafana/grafana)
              app=grafana-writer
              scope=grafana
              ;;
            grafana/grafana-enterprise)
              # Must be grafana-enterprise-writer: the writer-enterprise-* permission-sets
              # request workflows:write, which grafana-pr-automation does not have.
              app=grafana-enterprise-writer
              scope=enterprise
              ;;
            *)
              echo "Unsupported ownerRepo: $OWNER_REPO" >&2
              exit 1
              ;;
          esac
          if [[ "$REF_NAME" == release-* ]]; then
            tier=release
          else
            tier=main
          fi
          echo "github_app=${app}" | tee -a "$GITHUB_OUTPUT"
          echo "permission_set=writer-${scope}-${tier}" | tee -a "$GITHUB_OUTPUT"
      - name: Get GitHub App token
        id: get-github-app-token
        uses: grafana/shared-workflows/actions/create-github-app-token@46f48da11e78ebdba7a8747ae456b11062fac83e # create-github-app-token/v0.3.1
        with:
          github_app: ${{ steps.app-config.outputs.github_app }}
          permission_set: ${{ steps.app-config.outputs.permission_set }}
      - name: Check for existing release branch
        id: existing
        if: ${{ inputs.allow_existing }}
        env:
          OWNER_REPO: ${{ inputs.ownerRepo }}
          SOURCE: ${{ inputs.source }}
          GH_TOKEN: ${{ steps.get-github-app-token.outputs.token }}
        run: |
          # Match the bump-release action's patch bump; let the action validate other inputs.
          if [[ "$SOURCE" =~ ^release-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)([-+].*)?$ ]]; then
            branch="release-${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((10#${BASH_REMATCH[3]} + 1))"
            if gh api --silent "repos/${OWNER_REPO}/git/ref/heads/${branch}" 2>/dev/null; then
              echo "Release branch ${branch} already exists in ${OWNER_REPO}"
              echo "branch=${branch}" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Create release branch
        id: branch
        if: ${{ steps.existing.outputs.branch == '' }}
        uses: grafana/grafana-github-actions-go/bump-release@main # zizmor: ignore[unpinned-uses]
        with:
          ownerRepo: ${{ inputs.ownerRepo }}
          source: ${{ inputs.source }}
          token: ${{ steps.get-github-app-token.outputs.token }}
