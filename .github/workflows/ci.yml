name: CI

# Owns the trigger for every workflow it calls, so the Go cache is warm before
# anything reads it. The called workflows have no trigger of their own.

on:
  pull_request:
  push:
    branches:
      - main
      - release-*

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions: {}

jobs:
  detect-changes:
    if: github.event_name == 'pull_request' || github.repository == 'grafana/grafana'
    permissions:
      contents: read
    uses: ./.github/workflows/bootstrap-detect-changes.yml

  go-cache:
    needs: detect-changes
    permissions:
      contents: read
    uses: ./.github/workflows/bootstrap-go-cache.yml

  go-lint:
    needs: [detect-changes, go-cache]
    if: needs.detect-changes.outputs.backend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/go-lint.yml
    with:
      backend: ${{ needs.detect-changes.outputs.backend }}

  govulncheck:
    needs: [detect-changes, go-cache]
    if: needs.detect-changes.outputs.backend == 'true'
    permissions:
      contents: read
      id-token: write
      security-events: write
    uses: ./.github/workflows/govulncheck.yml

  feature-toggles:
    needs: [detect-changes, go-cache]
    if: ${{ !cancelled() && needs.go-cache.result != 'failure' && github.event_name == 'pull_request' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/feature-toggles-ci.yml
    with:
      backend: ${{ needs.detect-changes.outputs.backend }}
      docs: ${{ needs.detect-changes.outputs.docs }}

  backend-code-checks:
    needs: [detect-changes, go-cache]
    if: needs.detect-changes.outputs.docs != 'true' || needs.detect-changes.outputs.backend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/backend-code-checks.yml
    with:
      backend: ${{ needs.detect-changes.outputs.backend }}

  swagger-gen:
    needs: [detect-changes, go-cache]
    if: ${{ !cancelled() && needs.go-cache.result != 'failure' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/swagger-gen.yml
    with:
      backend: ${{ needs.detect-changes.outputs.backend }}

  go-workspace-check:
    needs: [detect-changes, go-cache]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pr-go-workspace-check.yml
    with:
      backend: ${{ needs.detect-changes.outputs.backend }}

  backend-unit-tests:
    needs: [detect-changes, go-cache]
    if: needs.detect-changes.outputs.backend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/backend-unit-tests.yml
    with:
      backend: ${{ needs.detect-changes.outputs.backend }}

  integration-tests:
    needs: [detect-changes, go-cache]
    if: needs.detect-changes.outputs.backend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pr-test-integration.yml
    with:
      backend: ${{ needs.detect-changes.outputs.backend }}

  integration-tests-pgvector:
    needs: [detect-changes, go-cache]
    if: needs.detect-changes.outputs.backend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pr-test-integration-pgvector.yml

  k8s-codegen-check:
    needs: [detect-changes, go-cache]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.backend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pr-k8s-codegen-check.yml

  build-go-matrix:
    needs: [detect-changes, go-cache]
    if: needs.detect-changes.outputs.backend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-go-matrix.yml

  e2e-tests:
    needs: [detect-changes, go-cache]
    if: ${{ !cancelled() && needs.go-cache.result != 'failure' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pr-e2e-tests.yml
    with:
      e2e: ${{ needs.detect-changes.outputs.e2e }}

  frontend-unit-tests:
    needs: [detect-changes, go-cache]
    if: ${{ !cancelled() && needs.go-cache.result != 'failure' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pr-frontend-unit-tests.yml
    with:
      frontend: ${{ needs.detect-changes.outputs.frontend }}
      devenv: ${{ needs.detect-changes.outputs.devenv }}

  schema-v2-e2e:
    needs: [detect-changes, go-cache]
    if: ${{ !cancelled() && needs.go-cache.result != 'failure' }}
    permissions:
      contents: read
    uses: ./.github/workflows/run-schema-v2-e2e.yml
