name: CI

# Owns the trigger for every workflow it calls, so the bootstrap runs once per
# push or pull request and everything below reads what it produced. The called
# workflows have no trigger of their own; giving one back would run them again
# outside this ordering, before the caches exist.
#
# The bootstrap jobs are independent of each other and run in parallel. Each
# workflow waits only on the ones it uses: a job that compiles nothing waits
# for modules but not for the build cache, and a frontend job waits for
# neither.

on:
  pull_request:
  push:
    branches:
      - main
      - release-*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions: {}

jobs:
  detect-changes:
    permissions:
      contents: read
    uses: ./.github/workflows/bootstrap-detect-changes.yml
    with:
      self: .github/workflows/**

  go-mod-cache:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/bootstrap-go-mod-cache.yml
    with:
      runs-on: ubuntu-x64

  go-build-cache:
    needs: [detect-changes, go-mod-cache]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/bootstrap-go-build-cache.yml
    with:
      runs-on: ubuntu-x64
      enterprise: ${{ github.event.pull_request.head.repo.fork == false }}

  go-remote-cache:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/bootstrap-go-remote-cache.yml

  yarn-cache:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/bootstrap-yarn-cache.yml

  # Modules only: these compile nothing, so they do not wait for the build cache.
  go-lint:
    needs: [detect-changes, go-mod-cache]
    if: needs.detect-changes.outputs.backend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/go-lint.yml
    with:
      backend: ${{ needs.detect-changes.outputs.backend }}

  # Everything below compiles, so it waits for the build cache.
  govulncheck:
    needs: [detect-changes, go-build-cache]
    if: needs.detect-changes.outputs.backend == 'true'
    permissions:
      contents: read
      id-token: write
      security-events: write
    uses: ./.github/workflows/govulncheck.yml

  feature-toggles:
    needs: [detect-changes, go-build-cache]
    if: ${{ !cancelled() && needs.go-build-cache.result != 'failure' && github.event_name == 'pull_request' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/feature-toggles-ci.yml
    with:
      backend: ${{ needs.detect-changes.outputs.backend }}
      docs: ${{ needs.detect-changes.outputs.docs }}

  backend-code-checks:
    needs: [detect-changes, go-build-cache]
    if: needs.detect-changes.outputs.docs != 'true' || needs.detect-changes.outputs.backend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/backend-code-checks.yml
    with:
      backend: ${{ needs.detect-changes.outputs.backend }}

  swagger-gen:
    needs: [detect-changes, go-build-cache]
    if: ${{ !cancelled() && needs.go-build-cache.result != 'failure' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/swagger-gen.yml
    with:
      backend: ${{ needs.detect-changes.outputs.backend }}

  go-workspace-check:
    needs: [detect-changes, go-build-cache]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pr-go-workspace-check.yml
    with:
      backend: ${{ needs.detect-changes.outputs.backend }}

  # Compile-heavy suites. These also use the remote cache, so they wait for its
  # tooling as well as the build cache.
  backend-unit-tests:
    needs: [detect-changes, go-build-cache, go-remote-cache]
    if: needs.detect-changes.outputs.backend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/backend-unit-tests.yml
    with:
      backend: ${{ needs.detect-changes.outputs.backend }}

  integration-tests:
    needs: [detect-changes, go-build-cache, go-remote-cache]
    if: needs.detect-changes.outputs.backend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pr-test-integration.yml
    with:
      backend: ${{ needs.detect-changes.outputs.backend }}

  integration-tests-pgvector:
    needs: [detect-changes, go-build-cache]
    if: needs.detect-changes.outputs.backend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pr-test-integration-pgvector.yml

  k8s-codegen-check:
    needs: [detect-changes, go-build-cache]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.backend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pr-k8s-codegen-check.yml

  build-go-matrix:
    needs: [detect-changes, go-build-cache]
    if: needs.detect-changes.outputs.backend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-go-matrix.yml

  # Backend and frontend both, so they wait on the Go and yarn caches.
  e2e-tests:
    needs: [detect-changes, go-build-cache, yarn-cache]
    if: ${{ !cancelled() && needs.go-build-cache.result != 'failure' && needs.yarn-cache.result != 'failure' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pr-e2e-tests.yml
    with:
      e2e: ${{ needs.detect-changes.outputs.e2e }}

  frontend-unit-tests:
    needs: [detect-changes, go-build-cache, yarn-cache]
    if: ${{ !cancelled() && needs.go-build-cache.result != 'failure' && needs.yarn-cache.result != 'failure' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pr-frontend-unit-tests.yml
    with:
      frontend: ${{ needs.detect-changes.outputs.frontend }}
      devenv: ${{ needs.detect-changes.outputs.devenv }}
