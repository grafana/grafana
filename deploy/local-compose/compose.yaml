services:
  fixtures:
    image: alpine:3.22
    volumes:
      - error-tracking-fixtures:/out
      - ../..:/src:ro
    entrypoint: [/bin/sh, -ec]
    command:
      - apk add --no-cache openssl >/dev/null && COMPOSE_FIXTURE_DIR=/out /src/deploy/local-compose/setup.sh

  auth-signer:
    depends_on:
      fixtures: {condition: service_completed_successfully}
    build:
      context: ./issuer
      dockerfile: Dockerfile
    image: error-tracking-local-issuer:local
    ports: ["127.0.0.1:${ERROR_TRACKING_SIGNER_PORT:-16481}:8080"]
    volumes:
      - error-tracking-signer-keys:/app/data/keys

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: error_tracking
      POSTGRES_USER: error_tracking
      POSTGRES_PASSWORD: local-only-password
    healthcheck:
      test: [CMD-SHELL, pg_isready -U error_tracking -d error_tracking]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - error-tracking-postgres:/var/lib/postgresql/data

  bootstrap-runtime-role:
    image: postgres:17-alpine
    depends_on:
      postgres: {condition: service_healthy}
      fixtures: {condition: service_completed_successfully}
    environment:
      PGHOST: postgres
      PGDATABASE: error_tracking
      PGSSLMODE: disable
      PGUSER: error_tracking
      PGPASSWORD: local-only-password
    volumes:
      - error-tracking-fixtures:/etc/error-tracking:ro
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        RUNTIME_PASSWORD=$$(cat /etc/error-tracking/runtime-password)
        export RUNTIME_PASSWORD
        psql -v ON_ERROR_STOP=1 <<'SQL'
        \getenv runtime_password RUNTIME_PASSWORD
        SELECT format('CREATE ROLE error_tracking_runtime LOGIN PASSWORD %L', :'runtime_password')
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'error_tracking_runtime') \gexec
        ALTER ROLE error_tracking_runtime PASSWORD :'runtime_password';
        GRANT CONNECT ON DATABASE error_tracking TO error_tracking_runtime;
        SQL

  migrate:
    build:
      context: ../../apps/errortracking
      dockerfile: Dockerfile
    image: error-tracking-api:local
    depends_on:
      bootstrap-runtime-role: {condition: service_completed_successfully}
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: error_tracking
      PGSSLMODE: disable
      PGUSER: error_tracking
      PGPASSWORD: local-only-password
      ERROR_TRACKING_RUNTIME_ROLE: error_tracking_runtime
    command: [migrate]

  api:
    build:
      context: ../../apps/errortracking
      dockerfile: Dockerfile
    image: error-tracking-api:local
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:${ERROR_TRACKING_API_PORT:-6443}:6443"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: error_tracking
      PGSSLMODE: disable
      PGUSER: error_tracking_runtime
      ERROR_TRACKING_RUNTIME_ROLE: error_tracking_runtime
    entrypoint: [/bin/sh, -ec]
    command: ["export PGPASSWORD=$$(cat /etc/error-tracking/runtime-password); exec /usr/local/bin/error-tracking serve --config=/etc/error-tracking/config.json"]
    volumes:
      - error-tracking-fixtures:/etc/error-tracking:ro

  grafana:
    build:
      context: ../..
      dockerfile: plugins/error-tracking/Dockerfile
      args:
        GRAFANA_IMAGE: ${ERROR_TRACKING_GRAFANA_BASE_IMAGE:-grafana/grafana-enterprise@sha256:184dfb3137aab22c3fdfbd60e622ba4f71ed56ad059c813b15d018ccd59102e1}
    image: error-tracking-grafana:local
    depends_on:
      api: {condition: service_started}
      fixtures: {condition: service_completed_successfully}
    ports: ["127.0.0.1:${ERROR_TRACKING_GRAFANA_PORT:-3301}:3000"]
    environment:
      GF_PATHS_CONFIG: /etc/grafana/grafana.ini
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: grafana-errortracking-app
    volumes:
      - error-tracking-fixtures:/etc/grafana:ro
      - error-tracking-grafana:/var/lib/grafana

volumes:
  error-tracking-fixtures:
  error-tracking-grafana:
  error-tracking-postgres:
  error-tracking-signer-keys:
