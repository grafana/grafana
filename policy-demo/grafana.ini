# Enables the experimental policy APIs. Merge into conf/custom.ini, or pass this file with
#   ./bin/grafana server --config policy-demo/grafana.ini
#
# policy.grafana.app is the platform API that stores validation policies and turns on the
# admission hook. rulepolicy and foldernaming are the two demo apps that write policies.
[grafana-apiserver]
runtime_config = policy.grafana.app/v0alpha1=true,rulepolicy.alerting.grafana.app/v0alpha1=true,foldernaming.grafana.app/v0alpha1=true
