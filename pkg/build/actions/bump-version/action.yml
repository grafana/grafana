name: Bump version
description: Updates package.json versions in Grafana and subpackages and regenerates schemas
inputs:
  version:
    description: The new version (ex. 1.2.3)
    required: true
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
    - name: Bump versions
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        PM=$(node -p "require('./package.json').packageManager.split('@')[0]")
        case "$PM" in
          yarn) corepack enable && yarn install ;;
          pnpm) npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")" && pnpm install --frozen-lockfile ;;
          *) echo "Unsupported package manager: $PM" >&2; exit 1 ;;
        esac
        npm version "$VERSION" --no-git-tag-version
        npm exec --no -- lerna version "$VERSION" --no-push --no-git-tag-version --force-publish --exact --yes
        case "$PM" in
          yarn) yarn install ;;
          pnpm) pnpm install --lockfile-only ;;
        esac
        npm run prettier:write
    - name: make gen-cue
      shell: bash
      run: make gen-cue
