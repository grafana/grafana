name: Bump version
description: Updates package.json versions in Grafana and subpackages and regenerates schemas
inputs:
  version:
    description: The new version (ex. 1.2.3)
    required: true
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
    # The checked-out branch may still use Yarn; the install action picks the package manager.
    - name: Install dependencies
      id: install
      uses: ./.github/actions/yarn-install
    - name: Bump versions
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        PACKAGE_MANAGER: ${{ steps.install.outputs.package-manager }}
      run: |
        npm version "$VERSION" --no-git-tag-version
        npm exec --no -- nx release version --groups=grafana "$VERSION"
        if [ "$PACKAGE_MANAGER" = 'yarn' ]; then
          yarn install --no-immutable
        else
          pnpm install --lockfile-only --no-frozen-lockfile
        fi
        npm run prettier:write
    - name: make gen-cue
      shell: bash
      run: make gen-cue
