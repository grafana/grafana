apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: foldernamingpolicies.foldernaming.grafana.app
spec:
  group: foldernaming.grafana.app
  names:
    kind: FolderNamingPolicy
    plural: foldernamingpolicies
  scope: Namespaced
  versions:
  - name: v0alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            description: |-
              A naming convention for the titles of folders in the namespace. A namespace may have several
              FolderNamingPolicies; a folder title must follow all of them.

              Only folders that are created, or whose title changes, are checked, so existing folders can
              still be moved or updated before they are renamed.
            properties:
              description:
                description: 'Explains the convention to whoever breaks it, e.g. "Start
                  with the owning team, like ''team-a: Alerts''".'
                type: string
              enforcement:
                enum:
                - Deny
                - Warn
                type: string
              titlePattern:
                description: 'An RE2 regular expression the whole folder title must
                  match, e.g. "[a-z0-9-]+: .+".'
                type: string
            required:
            - enforcement
            - titlePattern
            type: object
          status:
            properties:
              additionalFields:
                description: additionalFields is reserved for future use
                type: object
                x-kubernetes-preserve-unknown-fields: true
              operatorStates:
                additionalProperties:
                  properties:
                    descriptiveState:
                      description: descriptiveState is an optional more descriptive
                        state field which has no requirements on format
                      type: string
                    details:
                      description: details contains any extra information that is
                        operator-specific
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    lastEvaluation:
                      description: lastEvaluation is the ResourceVersion last evaluated
                      type: string
                    state:
                      description: |-
                        state describes the state of the lastEvaluation.
                        It is limited to three possible states for machine evaluation.
                      enum:
                      - success
                      - in_progress
                      - failed
                      type: string
                  required:
                  - lastEvaluation
                  - state
                  type: object
                description: |-
                  operatorStates is a map of operator ID to operator state evaluations.
                  Any operator which consumes this kind SHOULD add its state evaluation information to this field.
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
