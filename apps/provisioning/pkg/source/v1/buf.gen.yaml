version: v1
plugins:
  - plugin: go
    out: apps/provisioning/pkg/source/v1
    opt: paths=source_relative
  - plugin: go-grpc
    out: apps/provisioning/pkg/source/v1
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
  - plugin: grpc-gateway
    out: apps/provisioning/pkg/source/v1
    opt:
      - paths=source_relative
  - plugin: openapiv2
    out: apps/provisioning/pkg/source/v1
    opt:
      - allow_merge=true
      - merge_file_name=source
