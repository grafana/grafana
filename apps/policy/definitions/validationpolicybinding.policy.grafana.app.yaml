apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: validationpolicybindings.policy.grafana.app
spec:
  group: policy.grafana.app
  names:
    kind: ValidationPolicyBinding
    plural: validationpolicybindings
  scope: Namespaced
  versions:
  - name: v0alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            description: |-
              Connects a ValidationPolicy in the same namespace to the actions taken when it is violated.
              The binding applies to resources in its own namespace.
            properties:
              actions:
                items:
                  description: Deny rejects the request. Warn admits it and returns
                    a warning to the caller.
                  enum:
                  - Deny
                  - Warn
                  type: string
                type: array
              paramRef:
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              policyName:
                type: string
            required:
            - policyName
            - actions
            type: object
          status:
            properties:
              additionalFields:
                description: additionalFields is reserved for future use
                type: object
                x-kubernetes-preserve-unknown-fields: true
              operatorStates:
                additionalProperties:
                  properties:
                    descriptiveState:
                      description: descriptiveState is an optional more descriptive
                        state field which has no requirements on format
                      type: string
                    details:
                      description: details contains any extra information that is
                        operator-specific
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    lastEvaluation:
                      description: lastEvaluation is the ResourceVersion last evaluated
                      type: string
                    state:
                      description: |-
                        state describes the state of the lastEvaluation.
                        It is limited to three possible states for machine evaluation.
                      enum:
                      - success
                      - in_progress
                      - failed
                      type: string
                  required:
                  - lastEvaluation
                  - state
                  type: object
                description: |-
                  operatorStates is a map of operator ID to operator state evaluations.
                  Any operator which consumes this kind SHOULD add its state evaluation information to this field.
                type: object
            type: object
        required:
        - spec
        type: object
    selectableFields:
    - jsonPath: .spec.policyName
    served: true
    storage: true
    subresources:
      status: {}
