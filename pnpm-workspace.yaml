packages:
  - 'packages/*'
  - 'public/app/plugins/*/*'
  - 'e2e-playwright/test-plugins/*'

overrides:
  "@types/slate": "0.47.16"
  "@react-aria/dialog": "3.6.1"
  "@react-aria/focus": "3.22.1"
  "@react-aria/overlays": "3.32.1"
  "slate-dev-environment@^0.2.2": "0.2.5"
  "react-split-pane@0.1.92": "0.1.92"
  "history@4.10.1": "4.10.1"
  "history@^4.10.1": "4.10.1"
  "redux": "^5.0.0"
  "react-grid-layout": "1.4.4"
  "@grafana/plugin-e2e>@grafana/e2e-selectors": "workspace:*"
  "@grafana/scenes>@grafana/e2e-selectors": "workspace:*"
  "@grafana/scenes-react>@grafana/e2e-selectors": "workspace:*"
  "@grafana/alerting>@grafana/data": "workspace:*"
  "@grafana/alerting>@grafana/runtime": "workspace:*"
  "@grafana/alerting>@grafana/ui": "workspace:*"
  "@grafana/api-clients>@grafana/runtime": "workspace:*"
  "@grafana/sql>@grafana/runtime": "workspace:*"
  "swagger-ui-react>dompurify": "^3.4.16"
  "socks>ip-address": "10.7.4"
  "@mapbox/jsonlint-lines-primitives": "workspace:*"
  "get-document": "workspace:*"
  "storybook@10.6.2": "10.6.2"
  "storybook-react-rsbuild>@storybook/react": "10.6.2"
  "@types/slate>immutable": "^5.0.0"
  "@types/slate-react>immutable": "^5.0.0"
  "ws": "^8.20.1"
  "js-cookie": "^3.0.7"
  "@opentelemetry/core": "2.11.0"
  "shell-quote": "1.11.0"
  "tmp": "0.2.7"
  "react-calendar@^6.0.0": "6.0.1"
  "axios": "1.20.0"
  "@grafana/data>@braintree/sanitize-url": "7.0.1"
  "smol-toml@1.6.1": "1.9.0"

packageExtensions:
  "croact-css-styled@1.1.9":
    dependencies:
      croact: 1.0.4
  "doctrine@3.0.0":
    dependencies:
      assert: 2.0.0

patchedDependencies:
  "history@4.10.1": patches/history-npm-4.10.1-ee217563ae.patch
  "react-split-pane@0.1.92": patches/react-split-pane-npm-0.1.92-93dbf51dff.patch
  "slate-dev-environment@0.2.5": patches/slate-dev-environment-npm-0.2.5-9aeb7da7b5.patch
  "react-grid-layout@1.4.4": patches/react-grid-layout-npm-1.4.4-4024c5395b.patch
  "storybook@10.6.2": patches/storybook-npm-10.6.2-7da1cdbbd6.patch
  "react-calendar@6.0.1": patches/react-calendar-npm-6.0.1-22fe91a41c.patch

linkWorkspacePackages: true

allowBuilds:
  msw: true
  "@scarf/scarf": false
  "@swc/core": false
  "@tree-sitter-grammars/tree-sitter-yaml": false
  core-js: false
  core-js-pure: false
  esbuild: false
  nx: false
  protobufjs: false
  tree-sitter: false
  tree-sitter-json: false
  unrs-resolver: false

# msw's postinstall writes public/mockServiceWorker.js outside its package, which a cached build cannot restore.
sideEffectsCache: false

# Wait 3 days (in minutes) before resolving newly published versions.
minimumReleaseAge: 4320
# Only @grafana scoped packages may skip the release age check.
minimumReleaseAgeExclude:
  - "@grafana/aws-sdk"
  - "@grafana/scenes"
  - "@grafana/scenes-react"
  - "@grafana/plugin-e2e"
  - "@grafana/plugin-ui"
  - "@grafana/llm"
  - "@grafana/lezer-logql"
