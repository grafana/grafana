packages:
  - 'packages/*'
  - 'public/app/plugins/*/*'
  - 'e2e-playwright/test-plugins/*'

# Supply chain security — 3 days in minutes (matches yarn's npmMinimalAgeGate).
# pnpm 11 defaults to 1440 (1 day), so this must be set explicitly.
minimumReleaseAge: 4320
# Only @grafana-scoped packages may be excluded — excluding anything else would
# weaken the supply-chain gate. Security-fix version bumps are appended by
# `pnpm audit --fix` and need matching excludes when they pull recent releases.
minimumReleaseAgeExclude:
  - "@grafana/scenes"
  - "@grafana/scenes-react"
  - "@grafana/plugin-e2e"
  - "@grafana/plugin-ui"
  - "@grafana/lezer-logql"
  # Security backport still inside the release-age window (published 2026-06-26).
  # Every other patched version pinned in `overrides` below is already older than
  # the gate, so no further excludes are needed.
  - js-yaml@3.15.0

# Link workspace packages by version match, mimicking yarn. The @grafana/*
# packages reference each other by exact Lerna-managed version (e.g. 13.1.0-pre)
# rather than workspace:*, so without this pnpm would try to fetch them from npm.
linkWorkspacePackages: true

# Peer dependency handling for the monorepo.
resolvePeersFromWorkspaceRoot: true
dedupePeerDependents: true

# Force singletons for packages that export `unique symbol` types (RTK Query's
# skipToken). The react 18 / react-19-alias dual build makes pnpm create two
# @reduxjs/toolkit instances under different peer contexts, producing
# "unique symbol is not assignable" type errors. Removable once react 18 is retired.
publicHoistPattern:
  - "@reduxjs/toolkit"
  - "react-redux"

# Build-script allowlist — pnpm blocks install scripts by default. Each decision
# is deliberate: native builds are allowed, telemetry/optional native parsers denied.
allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false
  '@swc/core': true
  '@tree-sitter-grammars/tree-sitter-yaml': false
  core-js: false
  core-js-pure: false
  esbuild: true
  msw: true
  nx: true
  protobufjs: true
  tree-sitter: false
  tree-sitter-json: false
  unrs-resolver: true

# Package extensions — same syntax as the old .yarnrc.yml.
packageExtensions:
  croact-css-styled@1.1.9:
    dependencies:
      croact: "1.0.4"
  doctrine@3.0.0:
    dependencies:
      assert: "2.0.0"
  rc-trigger@2.6.5:
    peerDependencies:
      react: "17.0.1"
      react-dom: "17.0.1"

# Patches — moved from .yarn/patches/ to patches/ and renamed to pnpm convention.
patchedDependencies:
  # fork-ts-checker's inclusive watcher matches its ignore globs with minimatch but
  # without `dot: true`, so `**/node_modules/**` never matches pnpm's `.pnpm` store.
  # The type-checker then chokidar-watches all of node_modules, exhausting the OS
  # file-handle limit (EMFILE) on `pnpm start`. Enable dot matching so the ignore works.
  fork-ts-checker-webpack-plugin@9.1.0: patches/fork-ts-checker-webpack-plugin@9.1.0.patch
  history@4.10.1: patches/history@4.10.1.patch
  react-grid-layout@1.4.4: patches/react-grid-layout@1.4.4.patch
  react-split-pane@0.1.92: patches/react-split-pane@0.1.92.patch
  slate-dev-environment@0.2.5: patches/slate-dev-environment@0.2.5.patch
  storybook@10.3.6: patches/storybook@10.3.6.patch
  # Deduplicates processAsyncTree's queue so webpack doesn't re-enqueue the same
  # module through pnpm's symlinks until V8's array limit throws. Not fixed upstream.
  webpack@5.107.2: patches/webpack@5.107.2.patch

# Overrides — converted from package.json `resolutions`.
overrides:
  # --- Simple version pins ---
  underscore: "1.13.8"
  "@types/slate": "0.47.11"
  # Pin the (transitive) react-grid-layout to the patched version. yarn's
  # resolutions forced this via the patch: specifier; pnpm needs an explicit pin
  # or the version drifts and patches/react-grid-layout@1.4.4.patch goes unused.
  react-grid-layout: "1.4.4"
  redux: "^5.0.0"
  gitconfiglocal: "2.1.0"
  ws: "^8.20.1"
  js-cookie: "^3.0.7"
  "@opentelemetry/core": "2.10.0"
  # Drift pins: a fresh pnpm resolution moved these above the versions yarn.lock
  # had, and the newer releases broke types in code untouched by this migration
  # (react-hook-form 7.79 tightened Validate<>; @bsull/augurs 0.10.2 added
  # Symbol.dispose). Pin to the yarn-resolved versions; bump separately later.
  react-hook-form: "7.62.0"
  "@bsull/augurs": "0.10.1"
  # 7.16's no-node-access rule flags a test untouched by this migration; 7.1.1
  # (the yarn-resolved version) does not. Pin to keep lint stable.
  eslint-plugin-testing-library: "7.1.1"
  # 6.14's no-global-function-names flags pre-existing map-keys() usage; 6.2.1
  # (yarn-resolved, transitive via stylelint-config-sass-guidelines) does not.
  stylelint-scss: "6.2.1"
  # @storybook/test-runner asks for playwright ^1.14.0; a fresh pnpm resolution
  # picks a newer version than grafana's pinned @playwright/test (1.56.1), so the
  # browser `pnpm exec playwright install` downloads doesn't match the build the
  # test-runner launches (chrome-headless-shell missing → storybook a11y fails).
  # yarn deduped both to 1.56.1; pin to match so they share one browser version.
  playwright: "1.56.1"
  playwright-core: "1.56.1"
  # nwsapi is jsdom's CSS selector engine. 2.2.24 (fresh-resolved from jsdom's
  # ^2.2.2 range) matches :hover/:invalid in getComputedStyle after userEvent,
  # so the cascade overrides asserted styles in tests untouched by this migration
  # (LogRow, AutoSaveField). 2.2.2 (yarn-resolved) does not; pin to match.
  nwsapi: "2.2.2"
  # Single webpack version across all workspaces — a range across 20 package.json
  # files lets pnpm resolve two instances, crashing plugins with ".tap is undefined".
  webpack: "5.107.2"
  "@reduxjs/toolkit": "2.10.1"
  # @codemirror/lint requires view ^6.42.0 while @codemirror/autocomplete allows
  # ^6.17.0, so pnpm resolves two view copies. grafana-ui's CodeEditor imports
  # acceptCompletion (autocomplete's 6.41.0 view) into a KeyBinding typed against
  # the 6.43.1 view, and the private dispatchTransactions makes the types
  # non-assignable. Pin to one version that satisfies every range.
  "@codemirror/view": "6.43.1"
  # Dedupe the react-aria copies @grafana/plugin-ui 0.17.x pulls in; multiple
  # overlay/focus instances break focus management inside plugin config editors.
  "@react-aria/dialog": "3.5.31"
  "@react-aria/focus": "3.21.2"
  "@react-aria/overlays": "3.30.0"

  # --- Scoped version selectors (yarn npm: prefix dropped) ---
  "semver@~7.3.5": "^7.3.5"
  "debug@^0.7.2": "2.6.9"
  "debug@^0.7.4": "2.6.9"
  "tmp@^0.0.33": "~0.2.1"
  "js-yaml@4.1.1": "^4.1.0"
  "js-yaml@=4.1.1": "^4.1.0"

  # --- Nested overrides (yarn "/" separator becomes ">" in pnpm) ---
  "@grafana/plugin-e2e>@grafana/e2e-selectors": "workspace:*"
  "@grafana/scenes>@grafana/e2e-selectors": "workspace:*"
  "@grafana/scenes-react>@grafana/e2e-selectors": "workspace:*"
  "socks>ip-address": "10.3.1"
  "refractor>prismjs": "^1.27.0"
  "@types/slate>immutable": "^5.0.0"
  "@types/slate-react>immutable": "^5.0.0"
  # @testing-library/dom@10.4.1 allows ^0.5.9; pnpm picks 0.5.16, whose corrected
  # accessible-name handling (title vs text content) breaks TraceView SpanDetail
  # tests untouched by this migration. yarn locked 0.5.10 — pin to match.
  "@testing-library/dom>dom-accessibility-api": "0.5.10"

  # --- Vendored workspace packages (formerly github: deps) ---
  "@mapbox/jsonlint-lines-primitives": "workspace:*"
  get-document: "workspace:*"

  # --- Force ALL consumers (incl. external npm pkgs like @grafana/scenes,
  #     @grafana/plugin-ui) onto the workspace @grafana/* copies. The npm-published
  #     versions lack the src/ files that the @grafana-app/source export condition
  #     points to, so webpack fails with "no valid target file was found". ---
  "@grafana/data": "workspace:*"
  "@grafana/runtime": "workspace:*"
  "@grafana/ui": "workspace:*"
  "@grafana/e2e-selectors": "workspace:*"
  "@grafana/schema": "workspace:*"
  "@grafana/i18n": "workspace:*"

  # --- Version pin previously expressed as a patch: resolution ---
  "slate-dev-environment@^0.2.2": "0.2.5"

  # --- Security advisories ---
  # Each entry forces every (mostly transitive, dev-only) consumer onto a patched
  # release. Global pins are used where a single safe version satisfies all
  # consumers; `pkg@<x` selectors where another major must keep its own pin or only
  # the vulnerable range should move. dompurify is the only production-shipped
  # package here (swagger-ui-react, @grafana/data); the rest are dev/test tooling
  # (nodemailer/linkify-it via smtp-tester, js-yaml via jest, undici via lerna) or
  # types-only transitive deps (jspdf via @siedlerchr/types-ol-ext). A global pin
  # is required for jspdf because it is resolved as a peerDependency, which the
  # conditional `jspdf@<x` selectors do not reliably intercept.
  dompurify: "3.4.12"
  jspdf: "4.2.1"
  nodemailer: "9.0.3"
  linkify-it: "5.0.2"
  js-yaml@<3.15.0: "3.15.0"
  undici@<6.28.0: "6.28.0"
  tar@<=7.5.20: ^7.5.21
  uuid@<11.1.1: ^11.1.1
  shell-quote: "1.9.0"
  tmp: "0.2.7"
  "yaml@^1.10.0": "1.10.3"
  # brace-expansion patched each of its live majors separately, so each needs its
  # own selector — a global pin would drag 1.x consumers onto 5.x.
  "brace-expansion@<1.1.18": "^1.1.18"
  "brace-expansion@>=2.0.0 <2.1.4": "^2.1.4"
  "brace-expansion@>=3.0.0 <5.0.9": "^5.0.9"
  "fast-uri@<3.1.5": "^3.1.5"
  # socket.io (via @rsdoctor/webpack-plugin) allows the vulnerable 4.2.6.
  "socket.io-parser@<4.2.7": "^4.2.7"
  # Only the 4.x line is affected; 2.x/3.x consumers must keep their own major.
  "svgo@>=4.0.0 <4.0.2": "^4.0.2"
  "protobufjs@<7.6.5": "^7.6.5"
  # nx 22.7.2 (the `nx graph` CORS fix) exact-pins these three at vulnerable
  # versions where 22.5.4 used floating ranges. All three bumps stay within the
  # same major, and the target versions are already in the tree via other consumers.
  "axios@<1.18.0": "^1.18.0"
  "form-data@>=4.0.0 <4.0.6": "^4.0.6"
  "yaml@>=2.0.0 <2.8.3": "^2.8.3"
  # hono/@hono/node-server come from @modelcontextprotocol/sdk via @grafana/llm.
  # The sdk pins `@hono/node-server: ^1.19.9` and that advisory is only patched in
  # 2.x, so it stays open until the sdk bumps. hono's remaining CORS ReDoS fix
  # (4.12.34) is still inside minimumReleaseAge, and hono is not @grafana-scoped,
  # so it cannot be excluded from the gate.
  "hono@<4.12.27": "^4.12.27"
