# Provisioning bootstrap example. See devenv/provisioning-bootstrap/README.md.
#
#   ./setup.sh provisioning-bootstrap   # symlinks this to conf/custom.ini
#   make run

[provisioning]
bootstrap_path = devenv/provisioning-bootstrap

# Replaces the default set rather than extending it, so folders and dashboards are repeated.
resources = folder.grafana.app/Folder:folder, dashboard.grafana.app/Dashboard:folder, dashboard.grafana.app/LibraryPanel:folder, playlist.grafana.app/Playlist

[feature_toggles]
# Library panels are served under dashboard.grafana.app only with experimental APIs on.
grafanaAPIServerWithExperimentalAPIs = true
playlistsRBAC = true
# Without this the provisioned panel is invisible in the library panel UI.
libraryelements.kubernetesLibraryPanels = true

# library_element cannot hold the manager annotations, so the panel would come back unmanaged.
# This reroutes library panels instance-wide; see the README. Playlists are already migrated.
[unified_storage.librarypanels.dashboard.grafana.app]
dualWriterMode = 5
