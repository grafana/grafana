# Provisioning bootstrap configuration for local development.
#
# Grafana registers a local repository named "bootstrap" over the directory in bootstrap_path
# and provisions everything that directory declares. This is file provisioning through the
# provisioning system that also backs Git Sync; nothing here talks to Git.
# See devenv/provisioning-bootstrap/README.md.
#
#   ./setup.sh provisioning-bootstrap   # symlinks this file to conf/custom.ini
#   make run

[provisioning]
bootstrap_path = devenv/provisioning-bootstrap

# The default set declares library panels and playlists as :disabled, so the sync would skip the
# two examples in devenv/provisioning-bootstrap. Setting this replaces the default set, it does
# not extend it, so folders and dashboards are repeated here.
resources = folder.grafana.app/Folder:folder, dashboard.grafana.app/Dashboard:folder, dashboard.grafana.app/LibraryPanel:folder, playlist.grafana.app/Playlist

[feature_toggles]
# Library panels are served under dashboard.grafana.app only with experimental APIs on.
grafanaAPIServerWithExperimentalAPIs = true
playlistsRBAC = true

# Provisioning round-trips the manager and source annotations through unified storage, and the
# legacy library_element table has nowhere to keep them, so the library panel would come back
# unmanaged. Playlists need no entry: they are already fully migrated.
[unified_storage.librarypanels.dashboard.grafana.app]
dualWriterMode = 5
