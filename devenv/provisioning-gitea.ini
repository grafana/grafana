# Git Sync example, against the devenv Gitea. See devenv/provisioning-gitea/README.md.
#
#   make devenv sources=gitea            # Gitea on :3002, seeded
#   ./setup.sh provisioning-gitea        # symlinks this to conf/custom.ini
#   make run

[provisioning]
bootstrap_path = devenv/provisioning-gitea

# http:// with a token sends it in cleartext, so it is rejected without this.
allow_insecure = true

# Loopback URLs are rejected as SSRF unless the host is named here.
allowed_git_urls = localhost, 127.0.0.1

[feature_toggles]
# Lets "Migrate to GitOps" and the export job push existing resources into the repository.
provisioningExport = true
