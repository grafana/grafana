upstream grafana {
  server grafana1:3000 max_fails=1 fail_timeout=5s;
  server grafana2:3000 max_fails=1 fail_timeout=5s;
  server grafana3:3000 max_fails=1 fail_timeout=5s;
}

server {
  listen 80;

  location / {
    proxy_pass http://grafana;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    # Long-running watches.
    proxy_read_timeout 1h;
    proxy_buffering off;
  }
}
