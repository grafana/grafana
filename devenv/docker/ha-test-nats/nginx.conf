# Re-resolve the instances through Docker's DNS: a recreated container can get a new IP.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream grafana {
  zone grafana 64k;
  server grafana1:3000 resolve max_fails=1 fail_timeout=5s;
  server grafana2:3000 resolve max_fails=1 fail_timeout=5s;
  server grafana3:3000 resolve max_fails=1 fail_timeout=5s;
}

server {
  listen 80;

  location / {
    proxy_pass http://grafana;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    # Long-running watches.
    proxy_read_timeout 1h;
    proxy_buffering off;
  }
}
