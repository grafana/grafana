# my global config
global:
  scrape_interval:     10s # By default, scrape targets every 15 seconds.
  evaluation_interval: 10s # By default, scrape targets every 15 seconds.
  # scrape_timeout is set to the global default (10s).

# Load and evaluate rules in this file every 'evaluation_interval' seconds.
rule_files:
  - "alert.yml"
  - "recording.yml"
# - "second.rules"

alerting:
  alertmanagers:
  - scheme: http
    static_configs:
    - targets:
      - "alertmanager:9093"

scrape_configs:
  - job_name: 'prometheus'
    basic_auth:
      username: admin
      password: admin
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9101']

  - job_name: 'fake-data-gen'
    static_configs:
      - targets: ['fake-prometheus-data:9091']

  - job_name: 'grafana'
    static_configs:
      - targets: ['host.docker.internal:3000']

  # Duplicate scrapes of the same Grafana self-metrics target, each tagged with a different
  # fake `cluster` label, so grafana_vault_cache_size (a real Grafana self-metric — there is
  # no fake-data-gen source to modify) shows up as distinct multi-cluster series for the
  # Service Center scopes demo. service_name=vault is attached the same way; harmless here
  # since this target is only used for that demo, but not a generally-correct pattern if this
  # devenv gets reused for something else later.
  - job_name: 'grafana-prod-us-central-0'
    static_configs:
      - targets: ['host.docker.internal:3000']
        labels:
          cluster: prod-us-central-0
          service_name: vault

  - job_name: 'grafana-prod-us-east-1'
    static_configs:
      - targets: ['host.docker.internal:3000']
        labels:
          cluster: prod-us-east-1
          service_name: vault

  - job_name: 'prometheus-random-data'
    static_configs:
      - targets: ['prometheus-random-data:8080']

  - job_name: 'prometheus-high-card'
    static_configs:
      - targets: ['prometheus-high-card:9111']

  - job_name: 'prometheus-utf8'
    static_configs:
      - targets: [ 'prometheus-utf8:9112' ]

  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql-exporter:9104']
  # - job_name: 'grafana-test-datasource'
  #   metrics_path: /metrics/plugins/grafana-test-datasource
  #   static_configs:
  #     - targets: ['host.docker.internal:3000']
