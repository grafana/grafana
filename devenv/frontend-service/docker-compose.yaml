name: grafana-fs-dev

services:
  proxy:
    image: grafana-proxy
    build:
      context: .
      dockerfile: proxy.dockerfile
    volumes:
      - ../../public/build:/cdn/public/build
      - ../../public/app/plugins:/cdn/public/app/plugins
      - ../../public/fonts:/cdn/public/fonts
    # ports are set dynamically in the Tiltfile (derived from PORT)
    depends_on:
      - grafana-api
      - frontend-service
    labels:
      - 'alloy.logs=true'

  grafana-api:
    image: grafana-fs-dev
    build:
      context: ../..
      dockerfile: devenv/frontend-service/grafana-fs-dev.dockerfile
    entrypoint: ['bin/grafana', 'server']
    volumes:
      - backend-data:/grafana/data
      - ./provisioning/datasources:/grafana/conf/provisioning/datasources
      - ./provisioning/dashboards:/grafana/conf/provisioning/dashboards
      - ../dev-dashboards:/grafana/conf/dev-dashboards
      - ./configs/grafana-api.local.ini:/grafana/conf/custom.ini
      - ../../public/openapi3.json:/grafana/public/openapi3.json
      - ../../public/api-merged.json:/grafana/public/api-merged.json
    environment:
      OTEL_BSP_SCHEDULE_DELAY: 500
      GF_DEFAULT_APP_MODE: development
      GF_PANELS_ENABLE_ALPHA: true
      GF_DATABASE_URL: postgres://grafana:grafana@postgres:5432/grafana
      GF_SERVER_ROUTER_LOGGING: true
      GF_LOG_LEVEL: info
      OTEL_SERVICE_NAME: grafana-api
      GF_TRACING_OPENTELEMETRY_OTLP_ADDRESS: 'alloy:4317'
      GF_TRACING_OPENTELEMETRY_OTLP_PROPAGATION: jaeger,w3c
      GF_SMTP_ENABLED: true
      GF_SMTP_HOST: maildev:1025
    # ports are set dynamically in the Tiltfile (derived from PORT)
    labels:
      - 'alloy.logs=true'

  frontend-service:
    image: grafana-fs-dev
    build:
      context: ../..
      dockerfile: devenv/frontend-service/grafana-fs-dev.dockerfile
    entrypoint: ['bin/grafana', 'server', 'target']
    volumes:
      - ./configs/frontend-service.local.ini:/grafana/conf/custom.ini
    # ports are set dynamically in the Tiltfile (derived from PORT)
    labels:
      - 'alloy.logs=true'
    environment:
      OTEL_BSP_SCHEDULE_DELAY: 500
      GF_DATABASE_SKIP_MIGRATIONS: true
      GF_DATABASE_ENSURE_DEFAULT_ORG_AND_USER: false
      GF_DEFAULT_APP_MODE: development
      GF_DEFAULT_TARGET: frontend-server
      GF_SECURITY_CONTENT_SECURITY_POLICY: true
      GF_SECURITY_CONTENT_SECURITY_POLICY_TEMPLATE: "object-src 'none'; base-uri 'self'; form-action 'self' $FORM_ACTION_ADDITIONAL_HOSTS; frame-ancestors 'none'"
      GF_SERVER_ROUTER_LOGGING: true
      GF_LOG_LEVEL: info
      OTEL_SERVICE_NAME: frontend-service
      GF_TRACING_OPENTELEMETRY_OTLP_ADDRESS: 'alloy:4317'
      GF_TRACING_OPENTELEMETRY_OTLP_PROPAGATION: jaeger,w3c
      GF_FEATURE_TOGGLES_OPENFEATURE_PROVIDER: ofrep
      GF_FEATURE_TOGGLES_OPENFEATURE_URL: http://goff:1031
      GF_LOG_FRONTEND_ENABLED: true

  goff:
    image: gofeatureflag/go-feature-flag:latest@sha256:75df054abc2f03d51ad542a1eebe557a350c4fa45a09d79314647fcc9f690529
    command: /go-feature-flag --config /config/config.yaml
    # ports are set dynamically in the Tiltfile (derived from PORT)
    configs:
      - source: goff_config
        target: /config/config.yaml
      - source: goff_flags
        target: /flags/flags.yaml

  postgres:
    image: postgres:16.1-alpine3.19@sha256:17eb369d9330fe7fbdb2f705418c18823d66322584c77c2b43cc0e1851d01de7
    environment:
      POSTGRES_USER: grafana
      POSTGRES_PASSWORD: grafana
      POSTGRES_DB: grafana
    volumes:
      - postgres-data:/var/lib/postgresql/data
    labels:
      - 'alloy.logs=true'

  alloy:
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    volumes:
      - ./configs/alloy:/alloy-config
      - /var/run/docker.sock:/var/run/docker.sock # To scrape Docker container logs
      - alloy-data:/var/lib/alloy/data
    # ports are set dynamically in the Tiltfile (derived from PORT)
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /alloy-config
    depends_on:
      - loki
    labels:
      - 'alloy.logs=true'

  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    volumes:
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=native-histograms'
    labels:
      - 'alloy.logs=true'

  loki:
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    volumes:
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    labels:
      - 'alloy.logs=true'

  tempo-init:
    image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
    user: root
    entrypoint:
      - 'chown'
      - '10001:10001'
      - '/var/tempo'
    volumes:
      - tempo-data:/var/tempo

  tempo:
    image: grafana/tempo:2.9.0@sha256:65a5789759435f1ef696f1953258b9bbdb18eb571d5ce711ff812d2e128288a4
    volumes:
      - tempo-data:/var/lib/tempo
      - ./configs/tempo.yaml:/etc/tempo/tempo.yaml
    command: ['-config.file=/etc/tempo/tempo.yaml']
    labels:
      - 'alloy.logs=true'

    depends_on:
      tempo-init:
        condition: service_completed_successfully

  maildev:
    image: maildev/maildev:3.0.0@sha256:6e09695961f4aef9016a390ad391314a078220216601b15a35d389a7df2a3855
    ports:
      - '1080:1080'

configs:
  goff_config:
    content: |
      logLevel: debug
      logFormat: logfmt
      listen: 1031
      evaluationContextEnrichment:
        cluster: localdev
      retrievers:
        - kind: "file"
          path: "/flags/flags.yaml"
  goff_flags:
    file: ./goff-flags.yaml

volumes:
  backend-data:
  postgres-data:
  alloy-data:
  loki-data:
  tempo-data:
  prometheus-data:
